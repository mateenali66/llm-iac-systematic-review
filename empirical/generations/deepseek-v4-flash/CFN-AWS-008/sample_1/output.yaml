AWSTemplateFormatVersion: '2010-09-09'
Description: 'KMS Customer-Managed Key for Database Backup Encryption'

Parameters:
  KeyAlias:
    Type: String
    Default: 'alias/database-backup-key'
    Description: Alias for the KMS key
  KeyDescription:
    Type: String
    Default: 'KMS key for encrypting database backups'
    Description: Description for the KMS key

Resources:
  DatabaseBackupKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Ref KeyDescription
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: 'Enable IAM User Permissions'
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - 'kms:*'
            Resource: '*'
          - Sid: 'Allow administration of the key'
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:role/Admin'
            Action:
              - 'kms:Create*'
              - 'kms:Describe*'
              - 'kms:Enable*'
              - 'kms:List*'
              - 'kms:Put*'
              - 'kms:Update*'
              - 'kms:Revoke*'
              - 'kms:Disable*'
              - 'kms:Get*'
              - 'kms:Delete*'
              - 'kms:TagResource'
              - 'kms:UntagResource'
              - 'kms:ScheduleKeyDeletion'
              - 'kms:CancelKeyDeletion'
            Resource: '*'
          - Sid: 'Allow use of the key for database backup encryption'
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:role/DatabaseBackupRole'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      Tags:
        - Key: Name
          Value: !Ref KeyAlias
        - Key: Environment
          Value: !Ref AWS::StackName
        - Key: Purpose
          Value: 'Database Backup Encryption'

  DatabaseBackupKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Ref KeyAlias
      TargetKeyId: !Ref DatabaseBackupKmsKey

Outputs:
  KmsKeyId:
    Description: 'KMS Key ID for database backup encryption'
    Value: !Ref DatabaseBackupKmsKey
    Export:
      Name: !Sub '${AWS::StackName}-KmsKeyId'

  KmsKeyArn:
    Description: 'KMS Key ARN for database backup encryption'
    Value: !GetAtt DatabaseBackupKmsKey.Arn
    Export:
      Name: !Sub '${AWS::StackName}-KmsKeyArn'