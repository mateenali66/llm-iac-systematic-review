imports:
  - path: storage-bucket.py

resources:
  - name: static-website-bucket
    type: storage-bucket.py
    properties:
      name: my-static-website-bucket
      location: US
      storageClass: STANDARD
      versioning:
        enabled: true
      iamConfiguration:
        bucketPolicyOnly:
          enabled: true
      website:
        mainPageSuffix: index.html
        notFoundPage: 404.html
      cors:
        - origin: ["*"]
          method: ["GET", "HEAD"]
          responseHeader: ["Content-Type"]
          maxAgeSeconds: 3600
      labels:
        environment: production
        team: devops
      lifecycle:
        rule:
          - action:
              type: Delete
            condition:
              age: 365
              isLive: true