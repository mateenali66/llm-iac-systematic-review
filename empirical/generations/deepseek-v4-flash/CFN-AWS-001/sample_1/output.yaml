AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 bucket for application user uploads with access controls'

Parameters:
  BucketName:
    Type: String
    Description: 'Name of the S3 bucket for user uploads'
    AllowedPattern: '^[a-z0-9][a-z0-9.-]*[a-z0-9]$'
    ConstraintDescription: 'Bucket name must be lowercase alphanumeric, hyphens, and periods'

  Environment:
    Type: String
    Description: 'Environment name for tagging'
    AllowedValues:
      - dev
      - staging
      - prod
    Default: dev

  EnableVersioning:
    Type: String
    Description: 'Enable versioning on the bucket'
    AllowedValues:
      - true
      - false
    Default: true

  LoggingBucketName:
    Type: String
    Description: 'Name of the S3 bucket for access logs (must exist)'
    Default: ''

Conditions:
  HasLoggingBucket: !Not [!Equals [!Ref LoggingBucketName, '']]
  IsVersioningEnabled: !Equals [!Ref EnableVersioning, 'true']

Resources:
  UserUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      AccessControl: Private
      VersioningConfiguration:
        Status: !If [IsVersioningEnabled, 'Enabled', 'Suspended']
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        !If
          - HasLoggingBucket
          - DestinationBucketName: !Ref LoggingBucketName
            LogFilePrefix: !Sub 'access-logs/${BucketName}/'
          - !Ref 'AWS::NoValue'
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldUploads
            Status: Enabled
            ExpirationInDays: 365
            NoncurrentVersionExpirationInDays: 90
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Ref BucketName
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: UserUploads

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UserUploadsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${UserUploadsBucket}/*'
              - !Sub 'arn:aws:s3:::${UserUploadsBucket}'
            Condition:
              Bool:
                'aws:SecureTransport': false
          - Sid: DenyIncorrectEncryptionHeader
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub 'arn:aws:s3:::${UserUploadsBucket}/*'
            Condition:
              StringNotEquals:
                's3:x-amz-server-side-encryption': 'AES256'

Outputs:
  BucketName:
    Description: 'Name of the user uploads bucket'
    Value: !Ref UserUploadsBucket
  BucketArn:
    Description: 'ARN of the user uploads bucket'
    Value: !GetAtt UserUploadsBucket.Arn
  BucketDomainName:
    Description: 'Domain name of the user uploads bucket'
    Value: !GetAtt UserUploadsBucket.DomainName