imports:
  - path: templates/vpc.py
    name: vpc.py
  - path: templates/subnet.py
    name: subnet.py
  - path: templates/cloud_nat.py
    name: cloud_nat.py
  - path: templates/firewall.py
    name: firewall.py

resources:
  - name: custom-vpc
    type: vpc.py
    properties:
      name: my-custom-vpc
      autoCreateSubnetworks: false
      routingMode: REGIONAL

  - name: public-subnet
    type: subnet.py
    properties:
      name: public-subnet
      network: $(ref.custom-vpc.selfLink)
      region: us-central1
      ipCidrRange: 10.0.1.0/24
      privateIpGoogleAccess: false
      purpose: PRIVATE

  - name: private-subnet
    type: subnet.py
    properties:
      name: private-subnet
      network: $(ref.custom-vpc.selfLink)
      region: us-central1
      ipCidrRange: 10.0.2.0/24
      privateIpGoogleAccess: true
      purpose: PRIVATE

  - name: cloud-nat-router
    type: cloud_nat.py
    properties:
      name: cloud-nat-router
      network: $(ref.custom-vpc.selfLink)
      region: us-central1
      natIpAllocateOption: AUTO_ONLY
      sourceSubnetworkIpRangesToNat: LIST_OF_SUBNETWORKS
      subnetworks:
        - name: $(ref.private-subnet.selfLink)
          sourceIpRangesToNat:
            - ALL_IP_RANGES

  - name: allow-internal-firewall
    type: firewall.py
    properties:
      name: allow-internal
      network: $(ref.custom-vpc.selfLink)
      direction: INGRESS
      priority: 1000
      sourceRanges:
        - 10.0.0.0/16
      allowed:
        - IPProtocol: tcp
          ports:
            - 0-65535
        - IPProtocol: udp
          ports:
            - 0-65535
        - IPProtocol: icmp
      targetTags:
        - internal