imports:
  - path: templates/vpc.py
    name: vpc.py
  - path: templates/subnet.py
    name: subnet.py
  - path: templates/nat.py
    name: nat.py
  - path: templates/firewall.py
    name: firewall.py

resources:
  - name: custom-vpc
    type: vpc.py
    properties:
      name: my-custom-vpc
      autoCreateSubnetworks: false

  - name: public-subnet
    type: subnet.py
    properties:
      name: public-subnet
      region: us-central1
      network: $(ref.custom-vpc.selfLink)
      ipCidrRange: 10.0.1.0/24
      privateIpGoogleAccess: false

  - name: private-subnet
    type: subnet.py
    properties:
      name: private-subnet
      region: us-central1
      network: $(ref.custom-vpc.selfLink)
      ipCidrRange: 10.0.2.0/24
      privateIpGoogleAccess: true

  - name: cloud-nat
    type: nat.py
    properties:
      name: cloud-nat
      region: us-central1
      network: $(ref.custom-vpc.selfLink)
      subnetwork: $(ref.private-subnet.selfLink)
      sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES

  - name: allow-internal-firewall
    type: firewall.py
    properties:
      name: allow-internal
      network: $(ref.custom-vpc.selfLink)
      direction: INGRESS
      priority: 1000
      sourceRanges:
        - 10.0.0.0/16
      allowed:
        - IPProtocol: tcp
          ports:
            - 0-65535
        - IPProtocol: udp
          ports:
            - 0-65535
        - IPProtocol: icmp