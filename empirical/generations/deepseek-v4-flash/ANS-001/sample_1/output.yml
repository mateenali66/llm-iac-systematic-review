- name: Install and configure nginx on Ubuntu
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Ensure nginx is started and enabled at boot
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Allow port 80 in firewall (ufw)
      ufw:
        rule: allow
        port: '80'
        proto: tcp