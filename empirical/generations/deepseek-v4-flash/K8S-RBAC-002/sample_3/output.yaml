apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-cluster-role
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - example.io
  resources:
  - mycustomresources
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch