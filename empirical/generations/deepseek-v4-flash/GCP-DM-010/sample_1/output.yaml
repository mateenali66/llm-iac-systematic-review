imports:
  - path: templates/bucket.py
    name: bucket.py

resources:
  - name: multi-region-storage-bucket
    type: bucket.py
    properties:
      name: my-multi-region-bucket-${PROJECT_ID}
      location: US
      storageClass: STANDARD
      uniformBucketLevelAccess: true
      lifecycleRules:
        - action:
            type: Delete
          condition:
            age: 365