# FILE: Chart.yaml
apiVersion: v2
name: multi-tier-app
description: A Helm chart for a multi-tier application with frontend, backend, and PostgreSQL
type: application
version: 0.1.0
appVersion: "1.0.0"

---
# FILE: values.yaml
# Global settings
global:
  environment: production

# Frontend configuration
frontend:
  name: frontend
  replicaCount: 2
  image:
    repository: nginx
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  config:
    appName: "Multi-Tier App"
    apiEndpoint: "http://backend:8080/api"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

# Backend configuration
backend:
  name: backend
  replicaCount: 2
  image:
    repository: node
    tag: 18-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  config:
    dbHost: "postgres"
    dbPort: "5432"
    dbName: "appdb"
    logLevel: "info"
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

# PostgreSQL configuration
postgres:
  name: postgres
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  storage:
    size: 10Gi
    storageClass: standard
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  livenessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - postgres
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - postgres
    initialDelaySeconds: 5
    periodSeconds: 5

# Secrets configuration
secrets:
  postgres:
    username: postgres
    password: changeme
    database: appdb

---
# FILE: templates/_helpers.tpl
{{- define "multi-tier-app.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- end }}

{{- define "multi-tier-app.fullname" -}}
{{- if .Values.fullnameOverride }}
{{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $name := default .Chart.Name .Values.nameOverride }}
{{- if contains $name .Release.Name }}
{{- .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
{{- end }}

{{- define "multi-tier-app.labels" -}}
helm.sh/chart: {{ include "multi-tier-app.name" . }}-{{ .Chart.Version | replace "+" "_" }}
{{ include "multi-tier-app.selectorLabels" . }}
{{- if .Chart.AppVersion }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
{{- end }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}

{{- define "multi-tier-app.selectorLabels" -}}
app.kubernetes.io/name: {{ include "multi-tier-app.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

---
# FILE: templates/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-postgres-secret
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-username: {{ .Values.secrets.postgres.username | b64enc | quote }}
  postgres-password: {{ .Values.secrets.postgres.password | b64enc | quote }}
  postgres-database: {{ .Values.secrets.postgres.database | b64enc | quote }}

---
# FILE: templates/configmap-frontend.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-frontend-config
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    tier: frontend
data:
  app-name: {{ .Values.frontend.config.appName | quote }}
  api-endpoint: {{ .Values.frontend.config.apiEndpoint | quote }}

---
# FILE: templates/configmap-backend.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-backend-config
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    tier: backend
data:
  db-host: {{ .Values.backend.config.dbHost | quote }}
  db-port: {{ .Values.backend.config.dbPort | quote }}
  db-name: {{ .Values.backend.config.dbName | quote }}
  log-level: {{ .Values.backend.config.logLevel | quote }}

---
# FILE: templates/configmap-postgres.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-postgres-config
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    tier: postgres
data:
  postgres-init.sql: |
    CREATE DATABASE {{ .Values.secrets.postgres.database }};
    GRANT ALL PRIVILEGES ON DATABASE {{ .Values.secrets.postgres.database }} TO {{ .Values.secrets.postgres.username }};

---
# FILE: templates/service-frontend.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-frontend
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    tier: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "multi-tier-app.selectorLabels" . | nindent 4 }}
    tier: frontend

---
# FILE: templates/service-backend.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-backend
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    tier: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "multi-tier-app.selectorLabels" . | nindent 4 }}
    tier: backend

---
# FILE: templates/service-postgres.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-postgres
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    tier: postgres
spec:
  type: {{ .Values.postgres.service.type }}
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "multi-tier-app.selectorLabels" . | nindent 4 }}
    tier: postgres

---
# FILE: templates/deployment-frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-frontend
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    tier: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "multi-tier-app.selectorLabels" .