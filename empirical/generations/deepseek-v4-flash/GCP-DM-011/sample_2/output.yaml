imports:
- path: instance_template.jinja
  name: instance_template.jinja

resources:
- name: instance-template
  type: instance_template.jinja
  properties:
    machineType: n1-standard-1
    sourceImage: projects/debian-cloud/global/images/family/debian-10
    network: global/networks/default
    subnetwork: regions/us-central1/subnetworks/default
    tags:
      items:
      - http-server
      - https-server
    serviceAccounts:
    - email: default
      scopes:
      - https://www.googleapis.com/auth/cloud-platform
    metadata:
      items:
      - key: startup-script
        value: |
          #!/bin/bash
          apt-get update
          apt-get install -y apache2
          systemctl start apache2
          systemctl enable apache2
          echo "<html><body><h1>Welcome to ${HOSTNAME}</h1></body></html>" > /var/www/html/index.html

- name: instance-group-manager
  type: compute.v1.instanceGroupManager
  properties:
    zone: us-central1-a
    instanceTemplate: $(ref.instance-template.selfLink)
    targetSize: 1
    baseInstanceName: web-server
    namedPorts:
    - name: http
      port: 80
    - name: https
      port: 443
    autoHealingPolicies:
    - initialDelaySec: 300
      healthCheck: $(ref.health-check.selfLink)
    updatePolicy:
      type: PROACTIVE
      minimalAction: REPLACE
      maxSurge: 1
      maxUnavailable: 0
      minReadySec: 30

- name: autoscaler
  type: compute.v1.autoscaler
  properties:
    zone: us-central1-a
    target: $(ref.instance-group-manager.selfLink)
    autoscalingPolicy:
      minNumReplicas: 1
      maxNumReplicas: 5
      coolDownPeriodSec: 60
      cpuUtilization:
        utilizationTarget: 0.6

- name: health-check
  type: compute.v1.healthCheck
  properties:
    checkIntervalSec: 5
    timeoutSec: 5
    unhealthyThreshold: 2
    healthyThreshold: 2
    type: HTTP
    httpHealthCheck:
      port: 80
      requestPath: /

- name: backend-service
  type: compute.v1.backendService
  properties:
    backends:
    - group: $(ref.instance-group-manager.instanceGroup)
      balancingMode: UTILIZATION
      maxUtilization: 0.8
    healthChecks:
    - $(ref.health-check.selfLink)
    portName: http
    protocol: HTTP
    timeoutSec: 30
    enableCDN: false
    sessionAffinity: NONE

- name: url-map
  type: compute.v1.urlMap
  properties:
    defaultService: $(ref.backend-service.selfLink)

- name: target-http-proxy
  type: compute.v1.targetHttpProxy
  properties:
    urlMap: $(ref.url-map.selfLink)

- name: global-forwarding-rule
  type: compute.v1.globalForwardingRule
  properties:
    target: $(ref.target-http-proxy.selfLink)
    portRange: 80
    IPProtocol: TCP