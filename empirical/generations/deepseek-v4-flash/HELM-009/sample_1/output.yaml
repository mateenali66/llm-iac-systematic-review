# FILE: Chart.yaml
apiVersion: v2
name: nginx-reverse-proxy
description: A Helm chart for deploying NGINX as a reverse proxy
type: application
version: 1.0.0
appVersion: 1.25.3
---
# FILE: values.yaml
replicaCount: 2

image:
  repository: nginx
  tag: 1.25.3
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 80
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nginx:
  config:
    upstreamHost: "example.com"
    upstreamPort: 443
    listenPort: 80
    serverName: "_"
    proxyReadTimeout: "60s"
    proxyConnectTimeout: "5s"
    proxySendTimeout: "60s"
    proxyBufferSize: "8k"
    proxyBuffers: "8 8k"
    proxyBusyBuffersSize: "16k"
    proxyMaxTempFileSize: "1024m"

networkPolicy:
  enabled: true
  upstreamCIDR:
    - "0.0.0.0/0"
  ingressCIDR:
    - "0.0.0.0/0"

nodeSelector: {}
tolerations: []
affinity: {}
---
# FILE: templates/_helpers.tpl
{{- define "nginx-reverse-proxy.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- end }}

{{- define "nginx-reverse-proxy.fullname" -}}
{{- if .Values.fullnameOverride }}
{{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $name := default .Chart.Name .Values.nameOverride }}
{{- if contains $name .Release.Name }}
{{- .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
{{- end }}

{{- define "nginx-reverse-proxy.labels" -}}
helm.sh/chart: {{ include "nginx-reverse-proxy.name" . }}-{{ .Chart.Version | replace "+" "_" }}
{{ include "nginx-reverse-proxy.selectorLabels" . }}
{{- if .Chart.AppVersion }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
{{- end }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}

{{- define "nginx-reverse-proxy.selectorLabels" -}}
app.kubernetes.io/name: {{ include "nginx-reverse-proxy.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
---
# FILE: templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-reverse-proxy.fullname" . }}-config
  labels:
    {{- include "nginx-reverse-proxy.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;

        server {
            listen {{ .Values.nginx.config.listenPort }} default_server;
            server_name {{ .Values.nginx.config.serverName }};

            location / {
                proxy_pass https://{{ .Values.nginx.config.upstreamHost }}:{{ .Values.nginx.config.upstreamPort }};
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;

                proxy_read_timeout {{ .Values.nginx.config.proxyReadTimeout }};
                proxy_connect_timeout {{ .Values.nginx.config.proxyConnectTimeout }};
                proxy_send_timeout {{ .Values.nginx.config.proxySendTimeout }};
                proxy_buffer_size {{ .Values.nginx.config.proxyBufferSize }};
                proxy_buffers {{ .Values.nginx.config.proxyBuffers }};
                proxy_busy_buffers_size {{ .Values.nginx.config.proxyBusyBuffersSize }};
                proxy_max_temp_file_size {{ .Values.nginx.config.proxyMaxTempFileSize }};
            }
        }
    }
---
# FILE: templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginx-reverse-proxy.fullname" . }}
  labels:
    {{- include "nginx-reverse-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nginx-reverse-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nginx-reverse-proxy.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.nginx.config.listenPort }}
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "nginx-reverse-proxy.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# FILE: templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-reverse-proxy.fullname" . }}
  labels:
    {{- include "nginx-reverse-proxy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "nginx-reverse-proxy.selectorLabels" . | nindent 4 }}
---
# FILE: templates/networkpolicy.yaml
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nginx-reverse-proxy.fullname" . }}
  labels:
    {{- include "nginx-reverse-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nginx-reverse-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.ingressCIDR | first }}
      ports:
        - protocol: TCP
          port: {{ .Values.nginx.config.listenPort }}
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.upstreamCIDR | first }}
      ports:
        - protocol: TCP
          port: {{ .Values.nginx.config.upstreamPort }}
{{- end }}