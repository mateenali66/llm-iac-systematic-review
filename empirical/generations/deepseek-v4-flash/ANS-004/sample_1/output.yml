- name: Install and configure Prometheus node_exporter
  hosts: all
  become: yes
  vars:
    node_exporter_version: "1.6.1"
    node_exporter_arch: "amd64"
    node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    node_exporter_install_dir: "/opt/node_exporter"
    node_exporter_user: "node_exporter"
    node_exporter_group: "node_exporter"
    node_exporter_port: 9100

  tasks:
    - name: Create node_exporter system group
      group:
        name: "{{ node_exporter_group }}"
        system: yes
        state: present

    - name: Create node_exporter system user
      user:
        name: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        system: yes
        shell: "/sbin/nologin"
        create_home: no
        state: present

    - name: Create node_exporter install directory
      file:
        path: "{{ node_exporter_install_dir }}"
        state: directory
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        mode: "0755"

    - name: Download node_exporter binary archive
      get_url:
        url: "{{ node_exporter_download_url }}"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        checksum: "sha256:https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/sha256sums.txt"
        mode: "0644"

    - name: Extract node_exporter archive
      unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: "{{ node_exporter_install_dir }}"
        remote_src: yes
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        extra_opts: ["--strip-components=1"]
        creates: "{{ node_exporter_install_dir }}/node_exporter"

    - name: Set node_exporter binary permissions
      file:
        path: "{{ node_exporter_install_dir }}/node_exporter"
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        mode: "0755"

    - name: Configure node_exporter systemd service
      template:
        src: node_exporter.service.j2
        dest: "/etc/systemd/system/node_exporter.service"
        owner: root
        group: root
        mode: "0644"
      notify: restart node_exporter

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start node_exporter service
      systemd:
        name: node_exporter
        enabled: yes
        state: started

  handlers:
    - name: restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: yes