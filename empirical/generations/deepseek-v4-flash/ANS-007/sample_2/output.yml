- name: Configure static network interface on Debian 12 with netplan
  hosts: all
  become: yes
  vars:
    netplan_config:
      network:
        version: 2
        renderer: networkd
        ethernets:
          eth0:
            addresses:
              - "{{ static_ip }}"
            gateway4: "{{ gateway }}"
            nameservers:
              addresses: "{{ dns_servers }}"
    netplan_config_file: /etc/netplan/01-netcfg.yaml
    static_ip: 192.168.1.100/24
    gateway: 192.168.1.1
    dns_servers:
      - 8.8.8.8
      - 8.8.4.4

  tasks:
    - name: Ensure netplan is installed
      apt:
        name: netplan.io
        state: present
        update_cache: yes

    - name: Write netplan configuration
      copy:
        dest: "{{ netplan_config_file }}"
        content: "{{ netplan_config | to_nice_yaml(indent=2) }}"
        owner: root
        group: root
        mode: '0644'

    - name: Apply netplan configuration
      command: netplan apply
      changed_when: false