imports:
  - path: templates/kms.jinja

resources:
  - name: storage-encryption-keyring
    type: templates/kms.jinja
    properties:
      keyRingName: storage-encryption-keyring
      location: global
      keys:
        - name: storage-encryption-key
          purpose: ENCRYPT_DECRYPT
          versionTemplate:
            algorithm: GOOGLE_SYMMETRIC_ENCRYPTION
            protectionLevel: SOFTWARE
          labels:
            environment: production
            service: cloud-storage