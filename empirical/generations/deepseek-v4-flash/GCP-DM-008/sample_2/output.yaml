imports:
  - path: templates/kms.jinja

resources:
  - name: my-kms-keyring
    type: templates/kms.jinja
    properties:
      keyRingName: my-keyring
      location: us-central1
      keys:
        - name: my-storage-encryption-key
          purpose: ENCRYPT_DECRYPT
          versionTemplate:
            algorithm: GOOGLE_SYMMETRIC_ENCRYPTION
            protectionLevel: SOFTWARE
          labels:
            environment: production
            service: storage-encryption