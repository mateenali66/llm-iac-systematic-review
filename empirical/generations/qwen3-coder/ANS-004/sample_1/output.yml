---
- name: Install and configure Prometheus node_exporter
  hosts: all
  become: yes
  vars:
    node_exporter_version: "1.7.0"
    node_exporter_user: "node_exporter"
    node_exporter_group: "node_exporter"
    node_exporter_install_dir: "/usr/local/bin"
    node_exporter_data_dir: "/var/lib/node_exporter"
    node_exporter_config_dir: "/etc/node_exporter"
    node_exporter_port: 9100
    node_exporter_listen_address: "0.0.0.0:{{ node_exporter_port }}"
    node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive }}"

  tasks:
    - name: Create node_exporter group
      group:
        name: "{{ node_exporter_group }}"
        system: yes
        state: present

    - name: Create node_exporter user
      user:
        name: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        system: yes
        shell: /usr/sbin/nologin
        home: "{{ node_exporter_data_dir }}"
        create_home: no
        state: present

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        mode: '0755'
      loop:
        - "{{ node_exporter_data_dir }}"
        - "{{ node_exporter_config_dir }}"

    - name: Download node_exporter binary
      get_url:
        url: "{{ node_exporter_download_url }}"
        dest: "/tmp/{{ node_exporter_archive }}"
        mode: '0644'
        timeout: 30

    - name: Extract node_exporter binary
      unarchive:
        src: "/tmp/{{ node_exporter_archive }}"
        dest: "/tmp"
        remote_src: yes
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

    - name: Install node_exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ node_exporter_install_dir }}/node_exporter"
        mode: '0755'
        remote_src: yes
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"

    - name: Create systemd service file
      template:
        src: node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
        mode: '0644'
      vars:
        install_dir: "{{ node_exporter_install_dir }}"
        config_dir: "{{ node_exporter_config_dir }}"
        data_dir: "{{ node_exporter_data_dir }}"
        user: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        listen_address: "{{ node_exporter_listen_address }}"
      register: systemd_service

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: systemd_service.changed

    - name: Enable and start node_exporter service
      systemd:
        name: node_exporter
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Configure firewall for node_exporter
      firewalld:
        port: "{{ node_exporter_port }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      ignore_errors: yes

    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ node_exporter_archive }}"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"