---
- name: Configure static network interface on Debian 12
  hosts: all
  become: true
  vars:
    interface_name: eth0
    static_ip: 192.168.1.100/24
    gateway: 192.168.1.1
    dns_servers:
      - 8.8.8.8
      - 8.8.4.4
  tasks:
    - name: Install netplan.io package
      ansible.builtin.apt:
        name: netplan.io
        state: present
        update_cache: true

    - name: Configure static network interface with netplan
      ansible.builtin.template:
        src: netplan-config.j2
        dest: /etc/netplan/01-netcfg.yaml
        owner: root
        group: root
        mode: '0644'
      notify: Apply netplan configuration

    - name: Ensure netplan service is enabled
      ansible.builtin.service:
        name: systemd-networkd
        enabled: true

  handlers:
    - name: Apply netplan configuration
      ansible.builtin.command: netplan apply
      listen: Apply netplan configuration