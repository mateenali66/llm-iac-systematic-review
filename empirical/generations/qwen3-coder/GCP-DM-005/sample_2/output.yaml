resources:
- name: saas-postgres-instance
  type: gcp-types/sqladmin-v1beta4:instances
  properties:
    region: us-central1
    databaseVersion: POSTGRES_15
    settings:
      tier: db-custom-2-7680
      backupConfiguration:
        enabled: true
        startTime: "02:00"
        pointInTimeRecoveryEnabled: true
      ipConfiguration:
        ipv4Enabled: true
        authorizedNetworks:
        - name: default
          value: 0.0.0.0/0
      locationPreference:
        zone: us-central1-a
      dataDiskType: PD_SSD
      dataDiskSizeGb: 50
      maintenanceWindow:
        day: 7
        hour: 3
        updateTrack: stable
      databaseFlags:
      - name: log_checkpoints
        value: 'on'
      - name: log_connections
        value: 'on'
      - name: log_disconnections
        value: 'on'
      - name: log_lock_waits
        value: 'on'
      - name: log_min_messages
        value: 'warning'
      - name: log_temp_files
        value: '0'
      storageAutoResize: true
      storageAutoResizeLimit: 500
      activationPolicy: ALWAYS
      availabilityType: ZONAL
      insightsConfig:
        queryInsightsEnabled: true
        queryStringLength: 1024
        recordApplicationTags: true
        recordClientAddress: true
      connectorEnforcement: NOT_REQUIRED
    rootPassword: {{ properties["rootPassword"] }}
- name: saas-application-database
  type: gcp-types/sqladmin-v1beta4:databases
  properties:
    instance: $(ref.saas-postgres-instance.name)
    name: saas_application
  metadata:
    dependsOn:
    - saas-postgres-instance
- name: saas-app-user
  type: gcp-types/sqladmin-v1beta4:users
  properties:
    instance: $(ref.saas-postgres-instance.name)
    name: saas_app_user
    password: {{ properties["appUserPassword"] }}
  metadata:
    dependsOn:
    - saas-postgres-instance