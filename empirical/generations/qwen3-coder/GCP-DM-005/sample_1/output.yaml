imports:
- path: postgresql-instance.jinja

resources:
- name: saas-postgresql-instance
  type: postgresql-instance.jinja
  properties:
    region: us-central1
    zone: us-central1-a
    databaseVersion: POSTGRES_15
    settings:
      tier: db-custom-2-7680
      backupConfiguration:
        enabled: true
        startTime: "02:00"
        binaryLogEnabled: false
      ipConfiguration:
        ipv4Enabled: true
        authorizedNetworks:
        - value: "0.0.0.0/0"
          name: "allow-all"
      locationPreference:
        zone: us-central1-a
      dataDiskType: PD_SSD
      dataDiskSizeGb: 100
      maintenanceWindow:
        day: 7
        hour: 3
        updateTrack: stable
      databaseFlags:
      - name: log_checkpoints
        value: "on"
      - name: log_connections
        value: "on"
      - name: log_disconnections
        value: "on"
      - name: log_lock_waits
        value: "on"
      - name: log_min_messages
        value: "warning"
      - name: log_temp_files
        value: "0"
      - name: log_autovacuum_min_duration
        value: "0"
      storageAutoResize: true
      storageAutoResizeLimit: 500
      activationPolicy: ALWAYS
      availabilityType: ZONAL

- name: saas-database
  type: gcp-types/sqladmin-v1beta4:databases
  properties:
    instance: $(ref.saas-postgresql-instance.name)
    name: saas_main_db
  metadata:
    dependsOn:
    - saas-postgresql-instance

- name: saas-db-user
  type: gcp-types/sqladmin-v1beta4:users
  properties:
    instance: $(ref.saas-postgresql-instance.name)
    name: saas_app_user
    password: "{{ env['SAAS_DB_PASSWORD'] }}"
  metadata:
    dependsOn:
    - saas-postgresql-instance