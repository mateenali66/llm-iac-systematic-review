apiVersion: v1
kind: Service
metadata:
  name: web-frontend-service
  namespace: default
  labels:
    app: web-frontend
spec:
  type: LoadBalancer
  selector:
    app: web-frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  loadBalancerSourceRanges:
  - 0.0.0.0/0
  sessionAffinity: None
  externalTrafficPolicy: Cluster