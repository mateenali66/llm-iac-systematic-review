# FILE: Chart.yaml
apiVersion: v2
name: stateful-app-with-migration
description: A Helm chart for a stateful application with database migration
type: application
version: 1.0.0
appVersion: "1.0.0"

---
# FILE: values.yaml
# Default values for stateful-app-with-migration chart

# Application configuration
app:
  name: myapp
  image:
    repository: myapp/image
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 3
  containerPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env: []
  args: []

# Migration configuration
migration:
  enabled: true
  image:
    repository: migrate/migrate
    tag: latest
    pullPolicy: IfNotPresent
  command:
    - "/migrate"
    - "-path=/migrations"
    - "-database=$(DATABASE_URL)"
    - "up"
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: url
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

# Database configuration
database:
  host: postgresql
  port: 5432
  name: myapp
  user: myapp
  passwordSecretName: db-secret
  passwordSecretKey: password

# Storage configuration
storage:
  size: 10Gi
  className: ""
  accessModes:
    - ReadWriteOnce

# Service configuration
service:
  port: 8080
  targetPort: 8080

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

---
# FILE: templates/migration-job.yaml
{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stateful-app-with-migration.fullname" . }}-migration
  labels:
    {{- include "stateful-app-with-migration.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "stateful-app-with-migration.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          command: {{- toYaml .Values.migration.command | nindent 12 }}
          env:
            {{- range .Values.migration.env }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

---
# FILE: templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stateful-app-with-migration.fullname" . }}
  labels:
    {{- include "stateful-app-with-migration.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "stateful-app-with-migration.fullname" . }}-headless
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "stateful-app-with-migration.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stateful-app-with-migration.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.containerPort }}
              name: http
          env:
            {{- range .Values.app.env }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
            - name: DATABASE_HOST
              value: {{ .Values.database.host }}
            - name: DATABASE_PORT
              value: "{{ .Values.database.port }}"
            - name: DATABASE_NAME
              value: {{ .Values.database.name }}
            - name: DATABASE_USER
              value: {{ .Values.database.user }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretName }}
                  key: {{ .Values.database.passwordSecretKey }}
          args:
            {{- range .Values.app.args }}
            - {{ . }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- range .Values.storage.accessModes }}
          - {{ . }}
          {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
        {{- if .Values.storage.className }}
        storageClassName: {{ .Values.storage.className }}
        {{- end }}

---
# FILE: templates/service-headless.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stateful-app-with-migration.fullname" . }}-headless
  labels:
    {{- include "stateful-app-with-migration.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "stateful-app-with-migration.selectorLabels" . | nindent 4 }}

---
# FILE: templates/_helpers.tpl
{{/*
Expand the name of the chart.
*/}}
{{- define "stateful-app-with-migration.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Create a default fully qualified app name.
We truncate at 63 chars because some Kubernetes name fields are limited to this (by the DNS naming spec).
If release name contains chart name it will be used as a full name.
*/}}
{{- define "stateful-app-with-migration.fullname" -}}
{{- if .Values.fullnameOverride }}
{{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $name := default .Chart.Name .Values.nameOverride }}
{{- if contains $name .Release.Name }}
{{- .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
{{- end }}

{{/*
Create chart name and version as used by the chart label.
*/}}
{{- define "stateful-app-with-migration.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Common labels
*/}}
{{- define "stateful-app-with-migration.labels" -}}
helm.sh/chart: {{ include "stateful-app-with-migration.chart" . }}
{{ include "stateful-app-with-migration.selectorLabels" . }}
{{- if .Chart.AppVersion }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
{{- end }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}

{{/*
Selector labels
*/}}
{{- define "stateful-app-with-migration.selectorLabels" -}}
app.kubernetes.io/name: {{ include "stateful-app-with-migration.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}