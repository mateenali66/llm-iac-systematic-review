apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-cluster-role
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - your-operator.example.com
  resources:
  - yourcustomresources
  - yourcustomresources/status
  - yourcustomresources/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch