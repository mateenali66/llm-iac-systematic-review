AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM role for EC2 instances to write CloudWatch logs and read Parameter Store'

Parameters:
  RoleName:
    Type: String
    Default: EC2-CloudWatch-SSM-Role
    Description: Name of the IAM role for EC2 instances

Resources:
  EC2CloudWatchSSMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: CloudWatchLogsAndSSMRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogsWrite
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: 
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*:log-stream:*'
              - Sid: SSMParameterRead
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: 
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*'
              - Sid: SSMDescryptPermission
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

Outputs:
  RoleArn:
    Description: ARN of the created IAM role
    Value: !GetAtt EC2CloudWatchSSMRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EC2RoleArn'
  RoleName:
    Description: Name of the created IAM role
    Value: !Ref EC2CloudWatchSSMRole
    Export:
      Name: !Sub '${AWS::StackName}-EC2RoleName'