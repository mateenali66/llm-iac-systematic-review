resources:
- name: multi-region-storage-bucket
  type: storage.v1.bucket
  properties:
    location: US
    storageClass: MULTI_REGIONAL
    iamConfiguration:
      uniformBucketLevelAccess:
        enabled: true
    lifecycle:
      rule:
      - action:
          type: Delete
        condition:
          age: 365
    versioning:
      enabled: true
    logging:
      logBucket: ${ref.multi-region-storage-bucket.name}-logs
      logObjectPrefix: access-logs

- name: multi-region-storage-bucket-logs
  type: storage.v1.bucket
  properties:
    location: US
    storageClass: MULTI_REGIONAL
    iamConfiguration:
      uniformBucketLevelAccess:
        enabled: true
    lifecycle:
      rule:
      - action:
          type: Delete
        condition:
          age: 365
    versioning:
      enabled: true