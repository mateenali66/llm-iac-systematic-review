resources:
- name: multi-region-storage-bucket
  type: storage.v1.bucket
  properties:
    location: US
    storageClass: MULTI_REGIONAL
    iamConfiguration:
      uniformBucketLevelAccess:
        enabled: true
    lifecycle:
      rule:
      - action:
          type: Delete
        condition:
          age: 365
    versioning:
      enabled: false
    cors: []
    logging:
      logBucket: ${ref.multi-region-storage-bucket.name}
      logObjectPrefix: access-logs
    labels:
      environment: production
      managed-by: deployment-manager