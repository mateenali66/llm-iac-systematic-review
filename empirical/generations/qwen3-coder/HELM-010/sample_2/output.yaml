# FILE: Chart.yaml
apiVersion: v2
name: multi-tier-app
description: A Helm chart for a multi-tier application with frontend, backend, and PostgreSQL
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - multi-tier
  - web
  - postgresql
home: https://example.com
sources:
  - https://github.com/example/multi-tier-app

---
# FILE: values.yaml
# Default values for multi-tier-app chart

# Global configuration
global:
  imagePullSecrets: []
  imageRegistry: ""
  imageTag: "latest"

# Frontend configuration
frontend:
  name: frontend
  image:
    repository: nginx
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 3
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Backend configuration
backend:
  name: backend
  image:
    repository: python
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 3
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Database configuration
database:
  name: postgres
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  auth:
    postgresPassword: ""
    username: appuser
    password: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

---
# FILE: templates/frontend-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-{{ .Values.frontend.name }}
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.frontend.name }}
data:
  NGINX_HOST: {{ .Values.frontend.name }}.{{ .Release.Namespace }}.svc.cluster.local
  NGINX_PORT: "{{ .Values.frontend.service.port }}"

---
# FILE: templates/frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-{{ .Values.frontend.name }}
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.frontend.name }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "multi-tier-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.frontend.name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "multi-tier-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.frontend.name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: {{ .Values.frontend.name }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.global.imageRegistry }}{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "multi-tier-app.fullname" . }}-{{ .Values.frontend.name }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
# FILE: templates/frontend-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-{{ .Values.frontend.name }}
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.frontend.name }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "multi-tier-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.frontend.name }}

---
# FILE: templates/backend-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-{{ .Values.backend.name }}
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.backend.name }}
data:
  BACKEND_HOST: {{ .Values.backend.name }}.{{ .Release.Namespace }}.svc.cluster.local
  BACKEND_PORT: "{{ .Values.backend.service.port }}"
  DATABASE_HOST: {{ include "multi-tier-app.fullname" . }}-{{ .Values.database.name }}.{{ .Release.Namespace }}.svc.cluster.local
  DATABASE_PORT: "{{ .Values.database.service.port }}"

---
# FILE: templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multi-tier-app.fullname" . }}-{{ .Values.backend.name }}
  labels:
    {{- include "multi-tier-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.backend.name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "multi-tier-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.backend.name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "multi-tier-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.backend.name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Values.backend.name }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.global.imageRegistry }}{{ .Values.backend.image.repository }}:{{