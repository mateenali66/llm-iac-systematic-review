imports:
- path: instance-template.jinja

resources:
- name: mig-instance-template
  type: instance-template.jinja
  properties:
    machineType: e2-medium
    image: projects/debian-cloud/global/images/family/debian-11
    network: global/networks/default
    subnetwork: regions/us-central1/subnetworks/default
    tags:
      - http-server
      - https-server
    metadata:
      items:
      - key: startup-script
        value: |
          #!/bin/bash
          apt-get update
          apt-get install -y nginx
          systemctl start nginx
          systemctl enable nginx

- name: mig-instance-group
  type: compute.v1.instanceGroupManager
  properties:
    zone: us-central1-a
    instanceTemplate: $(ref.mig-instance-template.selfLink)
    targetSize: 1
    namedPorts:
    - name: http
      port: 80

- name: mig-autoscaler
  type: compute.v1.autoscaler
  properties:
    zone: us-central1-a
    target: $(ref.mig-instance-group.selfLink)
    autoscalingPolicy:
      minNumReplicas: 1
      maxNumReplicas: 5
      cpuUtilization:
        utilizationTarget: 0.6

- name: health-check
  type: compute.v1.healthCheck
  properties:
    type: HTTP
    httpHealthCheck:
      port: 80
      requestPath: /

- name: backend-service
  type: compute.v1.backendService
  properties:
    healthChecks:
    - $(ref.health-check.selfLink)
    backends:
    - group: $(ref.mig-instance-group.instanceGroup)
    portName: http
    protocol: HTTP
    timeoutSec: 30
    connectionDraining:
      drainingTimeoutSec: 300

- name: url-map
  type: compute.v1.urlMap
  properties:
    defaultService: $(ref.backend-service.selfLink)

