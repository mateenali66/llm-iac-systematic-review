resources:
- name: custom-vpc
  type: compute.v1.network
  properties:
    autoCreateSubnetworks: false
    routingConfig:
      routingMode: REGIONAL

- name: public-subnet
  type: compute.v1.subnetwork
  properties:
    network: $(ref.custom-vpc.selfLink)
    region: us-central1
    ipCidrRange: 10.0.1.0/24
    privateIpGoogleAccess: false

- name: private-subnet
  type: compute.v1.subnetwork
  properties:
    network: $(ref.custom-vpc.selfLink)
    region: us-central1
    ipCidrRange: 10.0.2.0/24
    privateIpGoogleAccess: true

- name: cloud-router
  type: compute.v1.router
  properties:
    network: $(ref.custom-vpc.selfLink)
    region: us-central1
    nats:
    - name: nat-config
      sourceSubnetworkIpRangesToNat: LIST_OF_SUBNETWORKS
      subnetworks:
      - name: $(ref.private-subnet.selfLink)
        sourceIpRangesToNat: ALL_IP_RANGES

- name: allow-internal-firewall
  type: compute.v1.firewall
  properties:
    network: $(ref.custom-vpc.selfLink)
    priority: 1000
    allowed:
    - IPProtocol: tcp
      ports: ['0-65535']
    - IPProtocol: udp
      ports: ['0-65535']
    - IPProtocol: icmp
    sourceRanges:
    - 10.0.0.0/8

- name: allow-ssh-firewall
  type: compute.v1.firewall
  properties:
    network: $(ref.custom-vpc.selfLink)
    priority: 1000
    allowed:
    - IPProtocol: tcp
      ports: ['22']
    sourceRanges:
    - 0.0.0.0/0
    targetTags: ['allow-ssh']