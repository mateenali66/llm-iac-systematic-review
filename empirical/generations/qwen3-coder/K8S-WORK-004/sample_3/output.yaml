apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-db-backup
  namespace: default
  labels:
    app: db-backup
    tier: backend
spec:
  schedule: "0 2 * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: db-backup
            tier: backend
        spec:
          restartPolicy: OnFailure
          containers:
          - name: db-backup
            image: myorg/db-backup:2.1
            imagePullPolicy: IfNotPresent
            env:
            - name: BACKUP_TIMESTAMP
              valueFrom:
                fieldRef:
                  fieldPath: metadata.creationTimestamp
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
            resources:
              requests:
                memory: "64Mi"
                cpu: "100m"
              limits:
                memory: "128Mi"
                cpu: "200m"
          securityContext:
            runAsNonRoot: true
            fsGroup: 65534
          automountServiceAccountToken: false