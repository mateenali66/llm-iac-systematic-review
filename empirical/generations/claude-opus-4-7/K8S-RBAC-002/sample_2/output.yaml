apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-clusterrole
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: operator
rules:
  # Cluster-wide read access to CustomResourceDefinitions
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch

  # Full lifecycle management of the operator's own custom resources
  - apiGroups:
      - example.com
    resources:
      - widgets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
      - deletecollection

  # Manage status subresource of the operator's custom resources
  - apiGroups:
      - example.com
    resources:
      - widgets/status
    verbs:
      - get
      - update
      - patch

  # Manage finalizers on the operator's custom resources
  - apiGroups:
      - example.com
    resources:
      - widgets/finalizers
    verbs:
      - update