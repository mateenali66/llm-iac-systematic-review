apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-clusterrole
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: operator
rules:
  # Cluster-wide read access to CustomResourceDefinitions
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  # Full management of the operator's own CRD instances
  - apiGroups:
      - operator.example.com
    resources:
      - myresources
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
      - deletecollection
  # Manage status subresource of the operator's CRD instances
  - apiGroups:
      - operator.example.com
    resources:
      - myresources/status
    verbs:
      - get
      - update
      - patch
  # Manage finalizers on the operator's CRD instances
  - apiGroups:
      - operator.example.com
    resources:
      - myresources/finalizers
    verbs:
      - update