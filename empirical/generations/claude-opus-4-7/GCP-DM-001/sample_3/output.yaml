resources:
- name: dev-vm-network
  type: compute.v1.network
  properties:
    autoCreateSubnetworks: false
    routingConfig:
      routingMode: REGIONAL

- name: dev-vm-subnet
  type: compute.v1.subnetwork
  properties:
    region: us-central1
    network: $(ref.dev-vm-network.selfLink)
    ipCidrRange: 10.10.0.0/24
    privateIpGoogleAccess: true
    logConfig:
      enable: true
      aggregationInterval: INTERVAL_5_SEC
      flowSampling: 0.5
      metadata: INCLUDE_ALL_METADATA

- name: dev-vm-fw-iap-ssh
  type: compute.v1.firewall
  properties:
    network: $(ref.dev-vm-network.selfLink)
    direction: INGRESS
    priority: 1000
    sourceRanges:
      - 35.235.240.0/20
    targetTags:
      - dev-vm
    allowed:
      - IPProtocol: tcp
        ports:
          - "22"
    logConfig:
      enable: true

- name: dev-vm-fw-deny-all
  type: compute.v1.firewall
  properties:
    network: $(ref.dev-vm-network.selfLink)
    direction: INGRESS
    priority: 65534
    sourceRanges:
      - 0.0.0.0/0
    denied:
      - IPProtocol: all
    logConfig:
      enable: true

- name: dev-vm-sa
  type: iam.v1.serviceAccount
  properties:
    accountId: dev-vm-sa
    displayName: Service Account for Dev VM

- name: dev-vm-instance
  type: compute.v1.instance
  metadata:
    dependsOn:
      - dev-vm-sa
      - dev-vm-subnet
  properties:
    zone: us-central1-a
    machineType: zones/us-central1-a/machineTypes/e2-medium
    tags:
      items:
        - dev-vm
    labels:
      environment: development
      managed-by: deployment-manager
      workload: dev
    disks:
      - deviceName: boot
        type: PERSISTENT
        boot: true
        autoDelete: true
        initializeParams:
          sourceImage: projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts
          diskType: zones/us-central1-a/diskTypes/pd-balanced
          diskSizeGb: 20
        diskEncryptionKey: {}
    networkInterfaces:
      - subnetwork: $(ref.dev-vm-subnet.selfLink)
    serviceAccounts:
      - email: $(ref.dev-vm-sa.email)
        scopes:
          - https://www.googleapis.com/auth/cloud-platform
    shieldedInstanceConfig:
      enableSecureBoot: true
      enableVtpm: true
      enableIntegrityMonitoring: true
    confidentialInstanceConfig:
      enableConfidentialCompute: false
    scheduling:
      preemptible: false
      automaticRestart: true
      onHostMaintenance: MIGRATE
    deletionProtection: false
    metadata:
      items:
        - key: enable-oslogin
          value: "TRUE"
        - key: enable-oslogin-2fa
          value: "TRUE"
        - key: block-project-ssh-keys
          value: "TRUE"
        - key: serial-port-enable
          value: "FALSE"
        - key: startup-script
          value: |
            #!/bin/bash
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get upgrade -y
            apt-get install -y unattended-upgrades fail2ban
            systemctl enable --now unattended-upgrades
            systemctl enable --now fail2ban

outputs:
- name: instanceName
  value: $(ref.dev-vm-instance.name)
- name: internalIp
  value: $(ref.dev-vm-instance.networkInterfaces[0].networkIP)
- name: serviceAccountEmail
  value: $(ref.dev-vm-sa.email)