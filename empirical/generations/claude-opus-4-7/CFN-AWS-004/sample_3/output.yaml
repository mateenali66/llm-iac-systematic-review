AWSTemplateFormatVersion: '2010-09-09'
Description: IAM role for EC2 instances to write CloudWatch Logs and read SSM Parameter Store configuration

Parameters:
  RoleName:
    Type: String
    Default: EC2LogsAndParameterStoreRole
    Description: Name of the IAM role
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '[\w+=,.@-]+'

  LogGroupPrefix:
    Type: String
    Default: '/ec2/application'
    Description: CloudWatch Logs log group prefix this role may write to

  ParameterStorePrefix:
    Type: String
    Default: '/app/config'
    Description: SSM Parameter Store path prefix this role may read from (without leading slash duplication)

Resources:
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Allows EC2 instances to write logs to CloudWatch and read configuration from Parameter Store
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Path: /
      MaxSessionDuration: 3600
      Tags:
        - Key: Name
          Value: !Ref RoleName
        - Key: ManagedBy
          Value: CloudFormation

  CloudWatchLogsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CloudWatchLogsWriteAccess
      Roles:
        - !Ref EC2InstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupPrefix}*'
          - Sid: WriteLogStreams
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogStreams
              - logs:DescribeLogGroups
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupPrefix}*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupPrefix}*:log-stream:*'

  ParameterStoreReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ParameterStoreReadAccess
      Roles:
        - !Ref EC2InstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource:
              - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterStorePrefix}/*'
              - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterStorePrefix}'
          - Sid: DescribeParameters
            Effect: Allow
            Action:
              - ssm:DescribeParameters
            Resource: '*'
          - Sid: DecryptSecureStringParameters
            Effect: Allow
            Action:
              - kms:Decrypt
            Resource:
              - !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${RoleName}-InstanceProfile'
      Path: /
      Roles:
        - !Ref EC2InstanceRole

Outputs:
  RoleName:
    Description: Name of the IAM role
    Value: !Ref EC2InstanceRole
    Export:
      Name: !Sub '${AWS::StackName}-RoleName'

  RoleArn:
    Description: ARN of the IAM role
    Value: !GetAtt EC2InstanceRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'

  InstanceProfileName:
    Description: Name of the EC2 instance profile
    Value: !Ref EC2InstanceProfile
    Export:
      Name: !Sub '${AWS::StackName}-InstanceProfileName'

  InstanceProfileArn:
    Description: ARN of the EC2 instance profile
    Value: !GetAtt EC2InstanceProfile.Arn
    Export:
      Name: !Sub '${AWS::StackName}-InstanceProfileArn'