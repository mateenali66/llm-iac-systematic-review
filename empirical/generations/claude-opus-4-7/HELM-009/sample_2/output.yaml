# FILE: Chart.yaml
apiVersion: v2
name: nginx-reverse-proxy
description: Production-grade NGINX reverse proxy Helm chart with ConfigMap, LoadBalancer Service, and NetworkPolicy
type: application
version: 1.0.0
appVersion: "1.27.0"
keywords:
  - nginx
  - reverse-proxy
  - ingress
maintainers:
  - name: platform-team
    email: platform@example.com
---
# FILE: values.yaml
replicaCount: 3

image:
  repository: nginx
  tag: "1.27.0-alpine"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  loadBalancerSourceRanges: []
  externalTrafficPolicy: Local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-reverse-proxy
          topologyKey: kubernetes.io/hostname

upstream:
  host: backend.default.svc.cluster.local
  port: 8080

# NetworkPolicy: restrict ingress to LB sources and egress to allowed upstreams only
networkPolicy:
  enabled: true
  ingress:
    # Allow ingress from anywhere on service port (LB); restrict via loadBalancerSourceRanges where possible
    fromNamespaces: []
    fromPodSelectors: []
    allowFromAll: true
  egress:
    # Allowed upstreams: list of {namespace, podSelector, ports}
    allowDNS: true
    upstreams:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: default
        podSelector:
          matchLabels:
            app: backend
        ports:
          - port: 8080
            protocol: TCP

nginxConfig: |
  worker_processes auto;
  error_log /var/log/nginx/error.log warn;
  pid /tmp/nginx.pid;

  events {
    worker_connections 1024;
  }

  http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream backend {
      server {{ .Values.upstream.host }}:{{ .Values.upstream.port }};
      keepalive 32;
    }

    server {
      listen 8080;
      server_name _;

      location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header