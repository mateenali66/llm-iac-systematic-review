# FILE: Chart.yaml
apiVersion: v2
name: nginx-reverse-proxy
description: Production-grade NGINX reverse proxy Helm chart with custom config, LoadBalancer Service, and NetworkPolicy
type: application
version: 1.0.0
appVersion: "1.27.0"
keywords:
  - nginx
  - reverse-proxy
  - ingress
maintainers:
  - name: platform-team
    email: platform@example.com
---
# FILE: values.yaml
replicaCount: 3

image:
  repository: nginx
  tag: "1.27.0-alpine"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  annotations: {}
  loadBalancerSourceRanges: []
  externalTrafficPolicy: Local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-reverse-proxy
          topologyKey: kubernetes.io/hostname

topologySpreadConstraints: []

# Upstream backend the proxy forwards to
upstream:
  host: backend.default.svc.cluster.local
  port: 8080
  # NetworkPolicy egress targets
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: default

networkPolicy:
  enabled: true
  ingress:
    # Allow ingress from anywhere (LoadBalancer); tighten as needed
    allowFromAnywhere: true
    fromNamespaceSelectors: []
    fromPodSelectors: []
  egress:
    allowDNS: true
    extraRules: []

pdb:
  enabled: true
  minAvailable: 1

nginx:
  workerProcesses: auto
  workerConnections: 1024
  keepaliveTimeout: 65
  clientMaxBodySize: 10m
  proxyConnectTimeout: 5s
  proxyReadTimeout: 30s
  proxySendTimeout: 30s
---
# FILE: templates/_helpers.tpl
{{/* Expand the name of the chart. */}}
{{- define "nginx-reverse-proxy.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" -}}
{{- end -}}

{{- define "nginx-reverse-proxy.fullname" -}}
{{- if .Values.fullnameOverride -}}
{{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" -}}
{{- else -}}
{{- $name := default .Chart.Name .Values.nameOverride -}}
{{- if contains $name .Release.Name -}}
{{- .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- else -}}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- define "nginx-reverse-proxy.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" -}}
{{- end -}}

{{- define "nginx-reverse-proxy.labels" -}}
helm.sh/chart: {{ include "nginx-reverse-proxy.chart" . }}
{{ include "nginx-reverse-proxy.selectorLabels" . }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end -}}

{{- define "nginx-reverse-proxy.selectorLabels" -}}
app.kubernetes.io/name: {{ include "nginx-reverse-proxy.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}

{{- define "nginx-reverse-proxy.serviceAccountName" -}}
{{- if .Values.serviceAccount.create -}}
{