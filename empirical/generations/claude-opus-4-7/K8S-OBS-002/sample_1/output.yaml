apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: api-metrics
    app.kubernetes.io/component: metrics
    release: prometheus
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app.kubernetes.io/name: api-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
      honorLabels: false
      honorTimestamps: true
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: node
          action: replace
        - sourceLabels:
            - __meta_kubernetes_namespace
          targetLabel: namespace
          action: replace
        - sourceLabels:
            - __meta_kubernetes_service_name
          targetLabel: service
          action: replace
        - sourceLabels:
            - __meta_kubernetes_pod_name
          targetLabel: pod
          action: replace
      metricRelabelings:
        - sourceLabels:
            - __name__
          regex: 'go_gc_duration_seconds.*|go_memstats_.*_bytes_total'
          action: drop