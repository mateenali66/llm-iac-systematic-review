# FILE: Chart.yaml
apiVersion: v2
name: redis-worker
description: A Helm chart for a generic worker service consuming messages from a Redis queue
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - worker
  - redis
  - queue
maintainers:
  - name: platform-team
    email: platform@example.com
---
# FILE: values.yaml
replicaCount: 2

image:
  repository: myorg/redis-worker
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

service:
  enabled: true
  type: ClusterIP
  port: 8080
  metricsPort: 9090

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

topologySpreadConstraints: []

priorityClassName: ""

terminationGracePeriodSeconds: 60

# Worker / Redis configuration
redis:
  host: redis-master.default.svc.cluster.local
  port: 6379
  db: 0
  queueName: "jobs"
  # tls: false
  # Provide one of the following for the password:
  #   - password: "plaintext" (will be stored in a generated Secret)
  #   - existingSecret + existingSecretPasswordKey (reference an externally managed secret)
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "redis-password"

worker:
  concurrency: 10
  logLevel: "info"
  pollIntervalMs: 1000
  maxRetries: 5
  extraEnv: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  redisNamespaceSelector: {}
  redisPodSelector: {}
---
# FILE: templates/_helpers.tpl
{{/*
Expand the name of the chart.
*/}}
{{- define "redis-worker.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" -}}
{{- end -}}

{{/*
Create a default fully qualified app name.
*/}}
{{- define "redis-worker.fullname" -}}
{{- if .Values.fullnameOverride -}}
{{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" -}}
{{- else -}}
{{- $name := default .Chart.Name .Values.nameOverride -}}
{{- if contains $name .Release.Name -}}
{{- .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- else -}}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{/*
Chart label.
*/}}
{{- define "redis-worker.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" -}}
{{- end -}}

{{/*
Common labels.
*/}}
{{- define "redis-worker.labels" -}}
helm.sh/chart: {{ include "redis-worker.chart" . }}
{{ include "redis-worker.selectorLabels" . }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
app.kubernetes.io/component: worker
{{- end -}}

{{/*
Selector labels.
*/}}
{{- define "redis-worker.selectorLabels" -}}
app.kubernetes.io/name: {{ include "redis-worker.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}

{{/*
Service account name.
*/}}
{{- define "redis-worker.serviceAccountName" -}}
{{- if .Values.serviceAccount.create -}}
{{- default (include "redis-worker.fullname" .) .Values.serviceAccount.name -}}
{{- else -}}
{{- default "default" .Values.serviceAccount.name -}}
{{- end -}}
{{- end -}}

{{/*
Secret name for Redis credentials.
*/}}
{{- define "redis-worker.redisSecretName" -}}
{{- if .Values.redis.existingSecret -}}
{{- .