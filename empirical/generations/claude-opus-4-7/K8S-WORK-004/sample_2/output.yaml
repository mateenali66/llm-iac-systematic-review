apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: backups
  labels:
    app.kubernetes.io/name: db-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/managed-by: kubernetes
spec:
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: db-backup
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: db-backup
              image: myorg/db-backup:2.1
              imagePullPolicy: IfNotPresent
              args: []
              env:
                - name: TZ
                  value: "Etc/UTC"
              envFrom:
                - secretRef:
                    name: db-backup-credentials
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                  ephemeral-storage: "1Gi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
                  ephemeral-storage: "5Gi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                privileged: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: backup-storage
              persistentVolumeClaim:
                claimName: db-backup-pvc