# FILE: Chart.yaml
apiVersion: v2
name: stateful-app
description: A Helm chart for a stateful application with pre-install database migrations
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: platform-team
    email: platform@example.com
kubeVersion: ">=1.23.0-0"
---
# FILE: values.yaml
nameOverride: ""
fullnameOverride: ""

replicaCount: 3

image:
  repository: myregistry/stateful-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  port: 8080
  name: http

containerPort: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /data

migration:
  enabled: true
  image:
    repository: myregistry/stateful-app-migrations
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  command: ["/bin/sh", "-c"]
  args:
    - "migrate -path=/migrations -database=$DATABASE_URL up"
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "database-url"

env: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: stateful-app
          topologyKey: kubernetes.io/hostname

updateStrategy:
  type: RollingUpdate

terminationGracePeriodSeconds: 60
---
# FILE: templates/_helpers.tpl
{{/* Expand the name of the chart. */}}
{{- define "stateful-app.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/* Create a default fully qualified app name. */}}
{{- define "stateful-app.fullname" -}}
{{- if .Values.fullnameOverride }}
{{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $name := default .Chart.Name .Values.nameOverride }}
{{- if contains $name .Release.Name }}
{{- .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
{{- end }}

{{- define "stateful-app.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
{{- end }}

{{- define "stateful-app.labels" -}}
helm.sh/chart: {{ include "stateful-app.chart" . }}
{{ include "stateful-app.selectorLabels" . }}
{{- if .Chart.AppVersion }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
{{- end }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}

{{- define "stateful-app.selectorLabels" -}}
app.kubernetes.io/name: {{ include "stateful-app.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- define "stateful-app.serviceAccountName" -}}
{{- if .Values.serviceAccount.create }}
{{- default (include "stateful-app.fullname" .) .Values.serviceAccount.name }}
{{- else }}
{{- default "default" .Values.serviceAccount.name }}
{{- end }}
{{- end }}

{{- define "stateful-app.headlessServiceName" -}}
{{- printf "%s-headless" (include "stateful-app.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- end }}
---
# FILE: templates/serviceaccount.