# FILE: Chart.yaml
apiVersion: v2
name: stateful-app
description: A Helm chart for a stateful application with database migrations
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: Platform Team
    email: platform@example.com
kubeVersion: ">=1.24.0-0"
---
# FILE: values.yaml
replicaCount: 3

image:
  repository: myregistry.example.com/stateful-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  name: http

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /var/lib/app

nodeSelector: {}
tolerations: []
affinity: {}

topologySpreadConstraints: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

updateStrategy:
  type: RollingUpdate

terminationGracePeriodSeconds: 60

database:
  host: postgres.database.svc.cluster.local
  port: 5432
  name: appdb
  user: appuser
  existingSecret: app-db-secret
  existingSecretPasswordKey: password

migration:
  enabled: true
  image:
    repository: myregistry.example.com/stateful-app-migrations
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  command:
    - /bin/sh
    - -c
    - "migrate -path /migrations -database $DATABASE_URL up"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600

env: []

extraEnvFrom: []

networkPolicy:
  enabled: false
---
# FILE: templates/_helpers.tpl
{{/* Expand the name of the chart. */}}
{{- define "stateful-app.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- end }}

{{- define "stateful-app.fullname" -}}
{{- if .Values.fullnameOverride }}
{{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $name := default .Chart.Name .Values.nameOverride }}
{{- if contains $name .Release.Name }}
{{- .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
{{- end }}

{{- define "stateful-app.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
{{- end }}

{{- define "stateful-app.labels" -}}
helm.sh/chart: {{ include "stateful-app.chart" . }}
{{ include "stateful-app.selectorLabels" . }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}

{{- define "stateful-app.selectorLabels" -}}
app.kubernetes.io/name: {{ include "stateful-app.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- define "stateful-app.serviceAccountName" -}}
{{- if .Values.serviceAccount.create }}
{{- default (include "stateful-app.fullname" .) .Values.serviceAccount.name }}
{{- else }}
{{- default "default" .Values.serviceAccount.name }}
{{- end }}
{{- end }}

{{- define "stateful-app.headlessServiceName" -}}
{{- printf "%s-headless" (include "stateful-app.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- end }}
---
# FILE: templates/serviceaccount.y