resources:
- name: mig-instance-template
  type: compute.v1.instanceTemplate
  properties:
    properties:
      machineType: e2-medium
      tags:
        items:
        - http-server
        - https-server
      disks:
      - deviceName: boot
        type: PERSISTENT
        boot: true
        autoDelete: true
        initializeParams:
          sourceImage: projects/debian-cloud/global/images/family/debian-12
          diskSizeGb: 20
          diskType: pd-balanced
      networkInterfaces:
      - network: global/networks/default
        accessConfigs:
        - name: External NAT
          type: ONE_TO_ONE_NAT
      serviceAccounts:
      - email: default
        scopes:
        - https://www.googleapis.com/auth/logging.write
        - https://www.googleapis.com/auth/monitoring.write
      shieldedInstanceConfig:
        enableSecureBoot: true
        enableVtpm: true
        enableIntegrityMonitoring: true
      metadata:
        items:
        - key: startup-script
          value: |
            #!/bin/bash
            set -euo pipefail
            apt-get update
            apt-get install -y nginx
            systemctl enable nginx
            systemctl start nginx
        - key: block-project-ssh-keys
          value: "true"

- name: mig-health-check
  type: compute.v1.healthCheck
  properties:
    type: HTTP
    httpHealthCheck:
      port: 80
      requestPath: /
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3

- name: mig-instance-group
  type: compute.v1.regionInstanceGroupManager
  properties:
    region: us-central1
    baseInstanceName: mig-vm
    instanceTemplate: $(ref.mig-instance-template.selfLink)
    targetSize: 1
    namedPorts:
    - name: http
      port: 80
    autoHealingPolicies:
    - healthCheck: $(ref.mig-health-check.selfLink)
      initialDelaySec: 300
    updatePolicy:
      type: PROACTIVE
      minimalAction: REPLACE
      maxSurge:
        fixed: 1
      maxUnavailable:
        fixed: 0

- name: mig-autoscaler
  type: compute.v1.regionAutoscaler
  properties:
    region: us-central1
    target: $(ref.mig-instance-group.selfLink)
    autoscalingPolicy:
      minNumReplicas: 1
      maxNumReplicas: 5
      coolDownPeriodSec: 60
      cpuUtilization:
        utilizationTarget: 0.6

- name: mig-backend-health-check
  type: compute.v1.healthCheck
  properties:
    type: HTTP
    httpHealthCheck:
      portSpecification: USE_SERVING_PORT
      requestPath: /
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3

- name: mig-backend-service
  type: compute.v1.backendService
  properties:
    protocol: HTTP
    portName: http
    timeoutSec: 30
    loadBalancingScheme: EXTERNAL_MANAGED
    enableCDN: false
    connectionDraining:
      drainingTimeoutSec: 60
    logConfig:
      enable: true
      sampleRate: 1.0
    healthChecks:
    - $(ref.mig-backend-health-check.selfLink)
    backends:
    - group: $(ref.mig-instance-group.instanceGroup)
      balancingMode: UTILIZATION
      maxUtilization: 0.8
      capacityScaler: 1.0

- name: mig-url-map
  type: compute.v1.urlMap
  properties:
    defaultService: $(ref.mig-backend-service.selfLink)

- name: mig-ssl-certificate
  type: compute.v1.sslCertificate
  properties:
    type: MANAGED
    managed:
      domains:
      - example.com

- name: mig-ssl-policy
  type: compute.v1.sslPolicy
  properties:
    profile: MODERN
    minTlsVersion: TLS_1_2

- name: mig-https-proxy
  type: compute.v1.targetHttpsProxy
  properties:
    urlMap: $(ref.mig-url-map.selfLink)
    sslCertificates:
    - $(ref.mig-ssl-certificate.selfLink)
    sslPolicy: $(ref.mig-ssl-policy.selfLink)

- name: mig-global-address
  type: compute.v1.globalAddress
  properties:
    addressType: EXTERNAL
    ipVersion: IPV4

- name: mig-https-forwarding-rule
  type: compute.v1.globalForwardingRule
  properties:
    target: $(ref.mig-https-proxy.selfLink)
    portRange: "443"
    IPAddress: $(ref.mig-global-address.address)
    IPProtocol: TCP
    loadBalancingScheme: EXTERNAL_MANAGED

- name: mig-allow-health-checks
  type: compute.v1.firewall
  properties:
    network: global/networks/default
    direction: INGRESS
    priority: 1000
    sourceRanges:
    - 130.211.0.0/22
    - 35.191.0.0/16
    targetTags:
    - http-server
    allowed:
    - IPProtocol: tcp
      ports:
      - "80"

outputs:
- name: loadBalancerIP
  value: $(ref.mig-global-address.address)
- name: backendServiceName
  value: $(ref.mig-backend-service.name)
- name: instanceGroupManagerName
  value: $(ref.mig-instance-group.name)