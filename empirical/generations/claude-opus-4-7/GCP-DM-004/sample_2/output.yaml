resources:
- name: prod-vpc
  type: compute.v1.network
  properties:
    autoCreateSubnetworks: false
    routingConfig:
      routingMode: REGIONAL

- name: public-subnet
  type: compute.v1.subnetwork
  properties:
    network: $(ref.prod-vpc.selfLink)
    region: us-central1
    ipCidrRange: 10.0.1.0/24
    privateIpGoogleAccess: true
    enableFlowLogs: true
    logConfig:
      aggregationInterval: INTERVAL_5_SEC
      flowSampling: 0.5
      metadata: INCLUDE_ALL_METADATA

- name: private-subnet
  type: compute.v1.subnetwork
  properties:
    network: $(ref.prod-vpc.selfLink)
    region: us-central1
    ipCidrRange: 10.0.2.0/24
    privateIpGoogleAccess: true
    enableFlowLogs: true
    logConfig:
      aggregationInterval: INTERVAL_5_SEC
      flowSampling: 0.5
      metadata: INCLUDE_ALL_METADATA

- name: nat-router
  type: compute.v1.router
  properties:
    network: $(ref.prod-vpc.selfLink)
    region: us-central1
    bgp:
      asn: 64514

- name: nat-gateway
  action: gcp-types/compute-v1:compute.routers.patch
  properties:
    router: $(ref.nat-router.name)
    region: us-central1
    project: $(ref.nat-router.region)
    nats:
    - name: private-subnet-nat
      natIpAllocateOption: AUTO_ONLY
      sourceSubnetworkIpRangesToNat: LIST_OF_SUBNETWORKS
      subnetworks:
      - name: $(ref.private-subnet.selfLink)
        sourceIpRangesToNat:
        - ALL_IP_RANGES
      logConfig:
        enable: true
        filter: ERRORS_ONLY
      minPortsPerVm: 64
      udpIdleTimeoutSec: 30
      tcpEstablishedIdleTimeoutSec: 1200
      tcpTransitoryIdleTimeoutSec: 30
      icmpIdleTimeoutSec: 30

- name: allow-internal
  type: compute.v1.firewall
  properties:
    network: $(ref.prod-vpc.selfLink)
    direction: INGRESS
    priority: 1000
    sourceRanges:
    - 10.0.0.0/16
    allowed:
    - IPProtocol: tcp
      ports: ["0-65535"]
    - IPProtocol: udp
      ports: ["0-65535"]
    - IPProtocol: icmp

- name: allow-iap-ssh
  type: compute.v1.firewall
  properties:
    network: $(ref.prod-vpc.selfLink)
    direction: INGRESS
    priority: 1000
    sourceRanges:
    - 35.235.240.0/20
    targetTags:
    - ssh-allowed
    allowed:
    - IPProtocol: tcp
      ports: ["22"]

- name: deny-all-ingress
  type: compute.v1.firewall
  properties:
    network: $(ref.prod-vpc.selfLink)
    direction: INGRESS
    priority: 65534
    sourceRanges:
    - 0.0.0.0/0
    denied:
    - IPProtocol: all

outputs:
- name: networkSelfLink
  value: $(ref.prod-vpc.selfLink)
- name: publicSubnetSelfLink
  value: $(ref.public-subnet.selfLink)
- name: privateSubnetSelfLink
  value: $(ref.private-subnet.selfLink)