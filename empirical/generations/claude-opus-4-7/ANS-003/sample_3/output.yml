---
- name: Harden CentOS 9 server
  hosts: all
  become: true
  gather_facts: true
  vars:
    ssh_port: 22
    allowed_ssh_users: []
    fail2ban_bantime: 3600
    fail2ban_findtime: 600
    fail2ban_maxretry: 5
    password_min_length: 14
    password_min_classes: 4

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Restart auditd
      ansible.builtin.command: /usr/sbin/service auditd restart
      changed_when: true

  tasks:
    - name: Ensure system is up to date
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      tags: [packages, updates]

    - name: Install EPEL repository
      ansible.builtin.dnf:
        name: epel-release
        state: present
      tags: [packages]

    - name: Install required hardening packages
      ansible.builtin.dnf:
        name:
          - fail2ban
          - fail2ban-firewalld
          - audit
          - audit-libs
          - libpwquality
          - openssh-server
          - firewalld
        state: present
      tags: [packages]

    - name: Ensure firewalld is enabled and running
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      tags: [firewall]

    # ---------------- SSH hardening ----------------
    - name: Backup original sshd_config
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: /etc/ssh/sshd_config.bak
        remote_src: true
        force: false
        owner: root
        group: root
        mode: '0600'
      tags: [ssh]

    - name: Apply secure SSH configuration
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/99-hardening.conf
        create: true
        owner: root
        group: root
        mode: '0600'
        marker: "# {mark} ANSIBLE MANAGED HARDENING BLOCK"
        block: |
          Port {{ ssh_port }}
          Protocol 2
          PermitRootLogin no
          PasswordAuthentication no
          PermitEmptyPasswords no
          ChallengeResponseAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          X11Forwarding no
          AllowAgentForwarding no
          AllowTcpForwarding no
          MaxAuthTries 3
          MaxSessions 4
          LoginGraceTime 30
          ClientAliveInterval 300
          ClientAliveCountMax 2
          IgnoreRhosts yes
          HostbasedAuthentication no
          UsePAM yes
          LogLevel VERBOSE
          Banner /etc/issue.net
          KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
          Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
          MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
      notify: Restart sshd
      tags: [ssh]

    - name: Create SSH warning banner
      ansible.builtin.copy:
        dest: /etc/issue.net
        owner: root
        group: root
        mode: '0644'
        content: |
          ******************************************************************
          *  Authorized access only. All activity is monitored and logged. *
          *  Unauthorized access will be prosecuted to the fullest extent. *
          ******************************************************************
      tags: [ssh]

    - name: Validate sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      tags: [ssh]

    # ---------------- Password complexity ----------------
    - name: Configure pwquality (password complexity)
      ansible.builtin.copy:
        dest: /etc/security/pwquality.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible
          minlen = {{ password_min_length }}
          minclass = {{ password_min_classes }}
          dcredit = -1
          ucredit = -1
          lcredit = -1
          ocredit = -1
          maxrepeat = 3
          maxclassrepeat = 4
          gecoscheck = 1
          dictcheck = 1
          usercheck = 1
          enforcing = 1
          enforce_for_root
          retry = 3
      tags: [password]

    - name: Configure password aging defaults in /etc/login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: "^{{ item.key }}"
        line: "{{ item.key }} {{ item.value }}"
        state: present
      loop:
        - { key: 'PASS_MAX_DAYS', value: '90' }
        - { key: 'PASS_MIN_DAYS', value: '7' }
        - { key: 'PASS_WARN_AGE', value: '14' }
        - { key: 'PASS_MIN_LEN',  value: "{{ password_min_length }}" }
        - { key: 'UMASK',         value: '027' }
      tags: [password]

    - name: Enforce password history via pam_pwhistory
      ansible.builtin.lineinfile:
        path: /etc/pam.d/system-auth
        insertafter: '^password\s+requisite\s+pam_pwquality.