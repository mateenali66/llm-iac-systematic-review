---
- name: Deploy Java application as systemd service
  hosts: all
  become: true

  vars:
    app_name: javaapp
    app_user: "{{ app_name }}"
    app_group: "{{ app_name }}"
    app_home: "/opt/{{ app_name }}"
    app_jar_src: "files/{{ app_name }}.jar"
    app_jar_dest: "{{ app_home }}/{{ app_name }}.jar"
    java_package: openjdk-21-jre-headless
    java_opts: "-Xms256m -Xmx512m"
    app_port: 8080
    systemd_unit_path: "/etc/systemd/system/{{ app_name }}.service"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart application
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted

  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install OpenJDK 21 (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ java_package }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install OpenJDK 21 (RedHat)
      ansible.builtin.dnf:
        name: java-21-openjdk-headless
        state: present
      when: ansible_os_family == "RedHat"

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true
        state: present

    - name: Create application service user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_home }}"
        create_home: false
        state: present

    - name: Create application home directory
      ansible.builtin.file:
        path: "{{ app_home }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0750"

    - name: Create application logs directory
      ansible.builtin.file:
        path: "{{ app_home }}/logs"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0750"

    - name: Copy application JAR
      ansible.builtin.copy:
        src: "{{ app_jar_src }}"
        dest: "{{ app_jar_dest }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
      notify: Restart application

    - name: Deploy systemd unit file
      ansible.builtin.copy:
        dest: "{{ systemd_unit_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description={{ app_name }} Java application
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_home }}
          ExecStart=/usr/bin/java {{ java_opts }} -jar {{ app_jar_dest }}
          SuccessExitStatus=143
          Restart=on-failure
          RestartSec=10
          TimeoutStopSec=30
          Environment=APP_PORT={{ app_port }}

          # Hardening
          NoNewPrivileges=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectSystem=strict
          ProtectHome=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          RestrictRealtime=true
          LockPersonality=true
          ReadWritePaths={{ app_home }}/logs
          CapabilityBoundingSet=
          AmbientCapabilities=
          SystemCallArchitectures=native

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart application

    - name: Ensure application service is enabled and started
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true
        state: started
        daemon_reload: true