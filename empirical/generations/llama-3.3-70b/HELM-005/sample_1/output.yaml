# FILE: Chart.yaml
name: multi-container-pod
version: 1.0.0
description: A Helm chart for deploying a multi-container Pod with a sidecar

# FILE: values.yaml
replicaCount: 1
image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent
fluentBit:
  image:
    repository: fluent/fluent-bit
    tag: latest
  config:
    input:
      tail:
        - name: container_logs
          path: /var/log/containers/*.log
          db: /var/log/flb_kube.db
          mem_buf_limit: 10MB
          tag: kube.*
    output:
      - name: es
        match: **
        host: elasticsearch
        port: 9200
        index: logs
        type: log
volume:
  size: 1Gi

# FILE: templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multi-container-pod.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "multi-container-pod.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "multi-container-pod.labels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        volumeMounts:
        - name: logs
          mountPath: /var/log
      - name: fluent-bit
        image: "{{ .Values.fluentBit.image.repository }}:{{ .Values.fluentBit.image.tag }}"
        volumeMounts:
        - name: logs
          mountPath: /var/log
        - name: flb-config
          mountPath: /etc/fluent-bit
        command: ["/usr/bin/fluent-bit"]
        args:
        - "-c"
        - "/etc/fluent-bit/fluent-bit.conf"
      volumes:
      - name: logs
        emptyDir: {}
      - name: flb-config
        configMap:
          name: {{ include "multi-container-pod.fullname" . }}-flb-config

# FILE: templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-container-pod.fullname" . }}-flb-config
data:
  fluent-bit.conf: |
    [INPUT]
      name = tail
      tag = kube.*
      path = /var/log/containers/*.log
      db = /var/log/flb_kube.db
      mem_buf_limit = 10MB
    [OUTPUT]
      name = es
      match = **
      host = elasticsearch
      port = 9200
      index = logs
      type = log

# FILE: templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-container-pod.fullname" . }}
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    {{- include "multi-container-pod.labels" . | nindent 4 }}