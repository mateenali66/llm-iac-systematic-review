# FILE: Chart.yaml
name: nginx-reverse-proxy
version: 1.0.0
description: A Helm chart for deploying NGINX as a reverse proxy

---
# FILE: values.yaml
replicaCount: 1
image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: LoadBalancer
  port: 80
configMap:
  nginxConf: |
    http {
      server {
        listen 80;
        location / {
          proxy_pass http://upstream-service:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }
      }
    }
upstreamService:
  name: upstream-service
  port: 8080
networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: upstream-service

---
# FILE: templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginx-reverse-proxy.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nginx-reverse-proxy.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nginx-reverse-proxy.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "nginx-reverse-proxy.fullname" . }}-config

---
# FILE: templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-reverse-proxy.fullname" . }}-config
data:
  nginx.conf: |
    {{ .Values.configMap.nginxConf | indent 4 }}

---
# FILE: templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-reverse-proxy.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nginx-reverse-proxy.labels" . | nindent 4 }}

---
# FILE: templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nginx-reverse-proxy.fullname" . }}-network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "nginx-reverse-proxy.labels" . | nindent 6 }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.upstreamService.name }}
      ports:
        - {{ .Values.upstreamService.port }}

---
# FILE: templates/_helpers.tpl
{{- define "nginx-reverse-proxy.labels" -}}
app: nginx-reverse-proxy
{{- end -}}

{{- define "nginx-reverse-proxy.fullname" -}}
{{ .Values.nameOverride | default .Chart.Name | trunc 63 | trimSuffix "-" -}}
{{- end -}}