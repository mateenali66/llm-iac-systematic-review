resources:
  - name: custom-vpc
    type: compute.v1.network
    properties:
      autoCreateSubnetworks: false
      routingConfig:
        routingMode: CUSTOM

  - name: public-subnet
    type: compute.v1.subnetwork
    properties:
      ipCidrRange: 10.10.0.0/24
      network: $(ref. custom-vpc.selfLink)
      region: us-central1

  - name: private-subnet
    type: compute.v1.subnetwork
    properties:
      ipCidrRange: 10.20.0.0/24
      network: $(ref. custom-vpc.selfLink)
      region: us-central1

  - name: cloud-nat
    type: compute.v1.router
    properties:
      network: $(ref. custom-vpc.selfLink)
      region: us-central1
      nats:
        - name: nat-config
          natIpAllocateOption: AUTO_ONLY
          sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES
          subnetworks:
            - $(ref. private-subnet.selfLink)

  - name: allow-internal-traffic
    type: compute.v1.firewall
    properties:
      network: $(ref. custom-vpc.selfLink)
      sourceRanges:
        - 10.10.0.0/24
        - 10.20.0.0/24
      allowed:
        - IPProtocol: TCP
          ports:
            - 0-65535
        - IPProtocol: UDP
          ports:
            - 0-65535
        - IPProtocol: ICMP

  - name: allow-outbound-traffic
    type: compute.v1.firewall
    properties:
      network: $(ref. custom-vpc.selfLink)
      sourceRanges:
        - 10.20.0.0/24
      allowed:
        - IPProtocol: TCP
          ports:
            - 80
            - 443
        - IPProtocol: UDP
          ports:
            - 53
      targetTags:
        - private-subnet-tag

  - name: allow-inbound-traffic-from-public-subnet
    type: compute.v1.firewall
    properties:
      network: $(ref. custom-vpc.selfLink)
      sourceTags:
        - public-subnet-tag
      targetTags:
        - private-subnet-tag
      allowed:
        - IPProtocol: TCP
          ports:
            - 0-65535
        - IPProtocol: UDP
          ports:
            - 0-65535
        - IPProtocol: ICMP

outputs:
  - name: public-subnet-self-link
    value: $(ref. public-subnet.selfLink)
  - name: private-subnet-self-link
    value: $(ref. private-subnet.selfLink)