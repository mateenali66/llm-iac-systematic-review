AWSTemplateFormatVersion: '2010-09-09'
Resources:
  EC2CloudWatchRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: EC2CloudWatchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: 'arn:aws:logs:*:*:*'
              - Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                  - 'ssm:GetParameters'
                  - 'ssm:GetParametersByPath'
                Resource: 'arn:aws:ssm:*:*:parameter/*'
  EC2CloudWatchRoleInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Roles:
        - !Ref EC2CloudWatchRole
Outputs:
  EC2CloudWatchRoleArn:
    Value: !GetAtt EC2CloudWatchRole.Arn
    Description: The ARN of the EC2 CloudWatch role
  EC2CloudWatchRoleInstanceProfileArn:
    Value: !GetAtt EC2CloudWatchRoleInstanceProfile.Arn
    Description: The ARN of the EC2 CloudWatch role instance profile