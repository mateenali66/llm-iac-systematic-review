apiVersion: v1
kind: Secret
metadata:
  name: postgres-password
type: Opaque
data:
  POSTGRES_PASSWORD: <base64 encoded password>
---
# Example usage in a Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
      - name: example
        image: example/image
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: POSTGRES_PASSWORD