resources:
  - name: redis-instance
    type: redis.v1.instance
    properties:
      tier: BASIC
      memorySizeGb: 1
      region: us-central1
      redisVersion: REDIS_6_X
      authorizedNetwork: $(ref:redis-network.selfLink)
  - name: redis-network
    type: compute.v1.network
    properties:
      autoCreateSubnetworks: true
  - name: redis-firewall
    type: compute.v1.firewall
    properties:
      network: $(ref:redis-network.selfLink)
      sourceRanges:
        - 0.0.0.0/0
      allowed:
        - IPProtocol: TCP
          ports:
            - 6379
      targetTags:
        - redis-instance
  - name: redis-ip
    type: compute.v1.address
    properties:
      region: us-central1
      addressType: INTERNAL
outputs:
  - name: redis-host
    value: $(ref:redis-instance.host)
  - name: redis-port
    value: 6379