apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-reader
  namespace: monitoring
rules:
- apiGroups: [""]
  resources:
  - pods
  - services
  - endpoints
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-reader
  namespace: monitoring
roleRef:
  name: monitoring-reader
  kind: Role
subjects:
- kind: ServiceAccount
  name: monitoring-reader
  namespace: monitoring