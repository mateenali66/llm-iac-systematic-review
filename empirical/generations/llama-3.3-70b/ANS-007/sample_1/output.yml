---
- name: Configure static network interface
  hosts: debian_hosts
  become: yes

  tasks:
  - name: Configure netplan
    netplan:
      state: present
      network:
        version: 2
        renderer: networkd
        ethernets:
          eth0:
            dhcp4: no
            addresses:
            - 192.168.1.100/24
            gateway4: 192.168.1.1
            nameservers:
              addresses:
              - 8.8.8.8
              - 8.8.4.4

  - name: Apply netplan configuration
    command: netplan apply
    notify: restart network

  handlers:
  - name: restart network
    service:
      name: systemd-networkd
      state: restarted