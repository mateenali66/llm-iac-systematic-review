resources:
  - name: static-website-bucket
    type: storage.v1.bucket
    properties:
      location: US
      storageClass: STANDARD
      bucketPolicy:
        iamPolicy:
          bindings:
            - role: roles/storage.objectViewer
              members:
                - allUsers
      cors:
        - maxAgeSeconds: 3600
          method: ['GET', 'HEAD']
          origin: ['*']
          responseHeader: ['Content-Type']
      website:
        mainPageSuffix: index.html
        NotFoundPage: 404.html
    accessControl:
      gcsBucketIamPolicy:
        bindings:
          - role: roles/storage.objectViewer
            members:
              - allUsers
          - role: roles/storage.legacyObjectReader
            members:
              - allUsers
          - role: roles/storage.admin
            members:
              - serviceAccount:$(ref.static-website-service-account.email)
      gcsBucketIamMembers:
        - role: roles/storage.objectViewer
          members:
            - allUsers
        - role: roles/storage.legacyObjectReader
          members:
            - allUsers
        - role: roles/storage.admin
          members:
            - serviceAccount:$(ref.static-website-service-account.email)
  - name: static-website-service-account
    type: iam.v1.serviceAccount
    properties:
      accountId: static-website-service-account
      displayName: Static Website Service Account
    accessControl:
      gcsBucketIamPolicy:
        bindings:
          - role: roles/iam.serviceAccountUser
            members:
              - serviceAccount:$(ref.static-website-service-account.email)