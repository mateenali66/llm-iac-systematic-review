resources:
  - name: cloud-kms-keyring
    type: cloudkms.v1.keyRing
    properties:
      parent: projects/${PROJECT_ID}/locations/global
      keyRingId: my-keyring

  - name: cloud-kms-key
    type: cloudkms.v1.cryptoKey
    properties:
      parent: $(ref. cloud-kms-keyring.name)
      cryptoKeyId: my-key
      purpose: ENCRYPT_DECRYPT
      versionTemplate:
        algorithm: GOOGLE_SYMMETRIC_ENCRYPTION

outputs:
  - name: keyRingId
    value: $(ref. cloud-kms-keyring.name)
  - name: keyId
    value: $(ref. cloud-kms-key.name)