---
- name: Install and Configure Docker
  become: yes
  tasks:
  - name: Install dependencies
    apt:
      name: "{{ item }}"
      state: present
    loop:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    when: ansible_distribution in ["Debian", "Ubuntu"]

  - name: Add Docker repository
    apt_repository:
      repo: https://download.docker.com/linux/{{ ansible_distribution|lower }}/docker-ce/repo
      state: present
    when: ansible_distribution in ["Debian", "Ubuntu"]

  - name: Install Docker
    apt:
      name: docker-ce
      state: present
    when: ansible_distribution in ["Debian", "Ubuntu"]

  - name: Install dependencies (RHEL)
    yum:
      name: "{{ item }}"
      state: present
    loop:
      - yum-utils
      - device-mapper-persistent-data
      - lvm2
    when: ansible_distribution in ["RedHat", "CentOS"]

  - name: Add Docker repository (RHEL)
    yum_repository:
      name: docker-ce
      description: Docker CE repository
      baseurl: https://download.docker.com/linux/{{ ansible_distribution|lower }}/7/x86_64/stable
      gpgcheck: yes
      gpgkey: https://download.docker.com/linux/{{ ansible_distribution|lower }}/gpg
      state: present
    when: ansible_distribution in ["RedHat", "CentOS"]

  - name: Install Docker (RHEL)
    yum:
      name: docker-ce
      state: present
    when: ansible_distribution in ["RedHat", "CentOS"]

  - name: Add user to docker group
    user:
      name: "{{ docker_user }}"
      group: docker
      append: yes
    when: docker_user is defined

  - name: Start and enable Docker service
    service:
      name: docker
      state: started
      enabled: yes

  - name: Ensure Docker socket permissions
    file:
      path: /var/run/docker.sock
      group: docker
      mode: '0660'
    when: docker_user is defined

- name: Verify Docker installation
  become: no
  tasks:
  - name: Verify Docker version
    command: docker --version
    register: docker_version
    failed_when: false
    changed_when: false

  - name: Verify Docker service status
    command: systemctl status docker
    register: docker_status
    failed_when: false
    changed_when: false
    when: ansible_distribution in ["Debian", "Ubuntu", "RedHat", "CentOS"]