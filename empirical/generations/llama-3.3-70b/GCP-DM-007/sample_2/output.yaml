resources:
  - name: gke-cluster
    type: container.v1.cluster
    properties:
      zone: us-central1-a
      cluster:
        name: prod-gke-cluster
        nodePools:
        - name: prod-node-pool
          config:
            diskSizeGb: 50
            diskType: pd-standard
            imageType: COS_CONTAINERD
            machineType: n1-standard-4
            oauthScopes:
            - https://www.googleapis.com/auth/devstorage.read_only
            - https://www.googleapis.com/auth/logging.write
            - https://www.googleapis.com/auth/monitoring
            - https://www.googleapis.com/auth/servicecontrol
            - https://www.googleapis.com/auth/service.management.readonly
            - https://www.googleapis.com/auth/trace.append
          initialNodeCount: 1
          management:
            autoRepair: true
            autoUpgrade: true
        networkPolicy:
          enabled: true
        privateClusterConfig:
          enablePrivateNodes: true
        releaseChannel:
          channel: REGULAR
        workloadIdentityConfig:
          identityNamespace: ${PROJECT_ID}.svc.id.goog
      nodePoolAutoConfig:
        enabled: true

  - name: gke-service-account
    type: iam.v1.serviceAccount
    properties:
      accountId: gke-service-account
      displayName: GKE Service Account

  - name: gke-service-account-key
    type: iam.v1.serviceAccountKey
    properties:
      serviceAccountId: $(ref.gke-service-account.name)
      keyAlgorithm: KEY_ALG_RSA_2048
      privateKeyType: TYPE_GOOGLE_CREDENTIALS_FILE

  - name: gke-service-account-iam-policy
    type: iam.v1.policy
    properties:
      bindings:
      - role: roles/container.developer
        members:
        - serviceAccount:$(ref.gke-service-account.email)
      - role: roles/monitoring.metricWriter
        members:
        - serviceAccount:$(ref.gke-service-account.email)
      - role: roles/logging.logWriter
        members:
        - serviceAccount:$(ref.gke-service-account.email)
      - role: roles/serviceaccount.user
        members:
        - serviceAccount:$(ref.gke-service-account.email)

outputs:
  - name: cluster-name
    value: $(ref.gke-cluster.name)
  - name: cluster-self-link
    value: $(ref.gke-cluster.selfLink)
  - name: node-pool-name
    value: $(ref.gke-cluster.properties.cluster.nodePools[0].name)