# FILE: Chart.yaml
name: stateful-app
version: 1.0.0
description: A Helm chart for a stateful application
type: application
appVersion: 1.0.0

---
# FILE: values.yaml
replicaCount: 1
image:
  repository: stateful-app
  tag: latest
  pullPolicy: IfNotPresent
database:
  name: stateful-app-db
  user: stateful-app-user
  password: stateful-app-password
migration:
  image:
    repository: stateful-app-migration
    tag: latest
  command: ["migrate", "up"]
pvc:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
service:
  port: 80

---
# FILE: templates/pre-install-migration.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: pre-install-migration
spec:
  template:
    spec:
      containers:
      - name: migration
        image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
        command: {{ .Values.migration.command }}
        env:
        - name: DB_NAME
          value: "{{ .Values.database.name }}"
        - name: DB_USER
          value: "{{ .Values.database.user }}"
        - name: DB_PASSWORD
          value: "{{ .Values.database.password }}"
      restartPolicy: OnFailure
  backoffLimit: 4

---
# FILE: templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: stateful-app
  template:
    metadata:
      labels:
        app: stateful-app
    spec:
      containers:
      - name: stateful-app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: {{ .Values.pvc.accessModes }}
      resources:
        requests:
          storage: {{ .Values.pvc.resources.requests.storage }}

---
# FILE: templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: stateful-app
spec:
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
  selector:
    app: stateful-app
  clusterIP: None

---
# FILE: templates/_helpers.tpl
{{/* Define a function to get the app version */}}
{{- define "appVersion" }}{{ .Values.appVersion }}{{ end }}

---
# FILE: templates/hooks.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: pre-install-migration
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "1"
spec:
  template:
    spec:
      containers:
      - name: migration
        image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
        command: {{ .Values.migration.command }}
        env:
        - name: DB_NAME
          value: "{{ .Values.database.name }}"
        - name: DB_USER
          value: "{{ .Values.database.user }}"
        - name: DB_PASSWORD
          value: "{{ .Values.database.password }}"
      restartPolicy: OnFailure
  backoffLimit: 4