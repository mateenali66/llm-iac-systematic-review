resources:
  - name: dev-vm
    type: compute.v1.instance
    properties:
      zone: us-central1-a
      machineType: e2-medium
      disks:
      - deviceName: boot
        type: PERSISTENT
        boot: true
        autoDelete: true
        initializeParams:
          diskSizeGb: 30
          sourceImage: https://www.googleapis.com/compute/v1/projects/ubuntu-os-cloud/global/images/ubuntu-2204-lts
      networkInterfaces:
      - accessConfigs:
        - type: ONE_TO_ONE_NAT
        name: nic0
      metadata:
        startup-script: |
          #! /bin/bash
          echo "Dev VM startup script executed"
      tags:
        items:
        - dev-vm
      canIpForward: false
      deletionProtection: false
      description: Development workload VM instance
      labels:
        environment: dev
        workload: development
      scheduling:
        automaticRestart: true
        onHostMaintenance: MIGRATE
        preemptible: false
      serviceAccounts:
      - email: default
        scopes:
        - https://www.googleapis.com/auth/devstorage.read_only
        - https://www.googleapis.com/auth/logging.write
        - https://www.googleapis.com/auth/monitoring.write
        - https://www.googleapis.com/auth/servicecontrol
        - https://www.googleapis.com/auth/service.management.readonly
        - https://www.googleapis.com/auth/trace.append
      shieldedVmConfig:
        enableSecureBoot: false
        enableVtpm: true
        enableIntegrityMonitoring: true
      confidentialInstanceConfig:
        enableConfidentialCompute: false
      reservationAffinity:
        consumeReservationType: ANY_RESERVATION
outputs:
  - name: instance-name
    value: $(ref.dev-vm.name)
  - name: instance-zone
    value: $(zone)