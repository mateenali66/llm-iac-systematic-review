AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECS Fargate cluster with internal NLB'

Resources:
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: '10.0.0.0/16'

  Subnet1:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.0.1.0/24'
      AvailabilityZone: 'us-east-1a'

  Subnet2:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.0.2.0/24'
      AvailabilityZone: 'us-east-1b'

  ECSCluster:
    Type: 'AWS::ECS::Cluster'

  ECSTaskDefinition1:
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      Family: 'microservice1'
      Cpu: '256'
      Memory: '512'
      NetworkMode: 'awsvpc'
      RequiresCompatibilities:
        - 'FARGATE'
      ExecutionRoleArn: !GetAtt 'ECSTaskExecutionRole.Arn'
      ContainerDefinitions:
        - Name: 'microservice1'
          Image: 'amazonlinux'
          PortMappings:
            - ContainerPort: 80
              HostPort: 80
              Protocol: 'tcp'

  ECSTaskDefinition2:
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      Family: 'microservice2'
      Cpu: '256'
      Memory: '512'
      NetworkMode: 'awsvpc'
      RequiresCompatibilities:
        - 'FARGATE'
      ExecutionRoleArn: !GetAtt 'ECSTaskExecutionRole.Arn'
      ContainerDefinitions:
        - Name: 'microservice2'
          Image: 'amazonlinux'
          PortMappings:
            - ContainerPort: 80
              HostPort: 80
              Protocol: 'tcp'

  ECSTaskExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ecs-tasks.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: 'ECSTaskExecutionPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'

  ECSService1:
    Type: 'AWS::ECS::Service'
    Properties:
      Cluster: !Ref ECSCluster
      DesiredCount: 1
      LaunchType: 'FARGATE'
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref Subnet1
            - !Ref Subnet2
          SecurityGroups:
            - !Ref SecurityGroup
          AssignPublicIp: 'DISABLED'
      TaskDefinition: !Ref ECSTaskDefinition1

  ECSService2:
    Type: 'AWS::ECS::Service'
    Properties:
      Cluster: !Ref ECSCluster
      DesiredCount: 1
      LaunchType: 'FARGATE'
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref Subnet1
            - !Ref Subnet2
          SecurityGroups:
            - !Ref SecurityGroup
          AssignPublicIp: 'DISABLED'
      TaskDefinition: !Ref ECSTaskDefinition2

  SecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref VPC
      GroupDescription: 'Security group for ECS services'

  InternalNLB:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      Name: 'internal-nlb'
      Subnets:
        - !Ref Subnet1
        - !Ref Subnet2
      Scheme: 'internal'
      Type: 'network'

  TargetGroup1:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Name: 'target-group-1'
      Port: 80
      Protocol: 'TCP'
      VpcId: !Ref VPC
      TargetType: 'ip'

  TargetGroup2:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Name: 'target-group-2'
      Port: 80
      Protocol: 'TCP'
      VpcId: !Ref VPC
      TargetType: 'ip'

  Listener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      LoadBalancerArn: !Ref InternalNLB
      Port: 80
      Protocol: 'TCP'
      DefaultActions:
        - Type: 'forward'
          TargetGroupArn: !Ref TargetGroup1

  ListenerRule1:
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Actions:
        - Type: 'forward'
          TargetGroupArn: !Ref TargetGroup1
      Conditions:
        - Field: 'path-pattern'
          Values:
            - '/microservice1*'

  ListenerRule2:
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'
    Properties:
      ListenerArn: !Ref Listener
      Priority: 2
      Actions:
        - Type: 'forward'
          TargetGroupArn: !Ref TargetGroup2
      Conditions:
        - Field: 'path-pattern'
          Values:
            - '/microservice2*'

Outputs:
  InternalNLB:
    Value: !Ref InternalNLB
    Description: 'Internal NLB'