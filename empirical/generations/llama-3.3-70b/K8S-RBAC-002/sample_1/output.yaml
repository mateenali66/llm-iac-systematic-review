apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-clusterrole
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions/status
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - <operator-group>
  resources:
  - <operator-crd-plural>
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch