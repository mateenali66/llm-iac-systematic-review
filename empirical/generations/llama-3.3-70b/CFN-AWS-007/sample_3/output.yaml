AWSTemplateFormatVersion: '2010-09-09'
Description: A CloudFormation template for creating a CloudWatch Dashboard for a Lambda-based API.

Resources:
  LambdaFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      Handler: index.handler
      Role: !GetAtt 'LambdaExecutionRole.Arn'
      Runtime: nodejs14.x
      Code:
        ZipFile: |

  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: execution-role-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: 'arn:aws:logs:*:*:*'

  CloudWatchDashboard:
    Type: 'AWS::CloudWatch::Dashboard'
    Properties:
      DashboardName: !Sub 'Lambda-API-Dashboard-${AWS::Region}'
      DashboardBody: |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${LambdaFunction}", { "stat": "Sum" }],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${LambdaFunction}", { "stat": "Average" }]
                ],
                "region": "${AWS::Region}",
                "title": "Lambda Invocations",
                "period": 300,
                "legend": {
                  "position": "bottom"
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${LambdaFunction}", { "stat": "Sum" }]
                ],
                "region": "${AWS::Region}",
                "title": "Lambda Errors",
                "period": 300,
                "legend": {
                  "position": "bottom"
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  ["AWS/Lambda", "Throttles", "FunctionName", "${LambdaFunction}", { "stat": "Sum" }]
                ],
                "region": "${AWS::Region}",
                "title": "Lambda Throttles",
                "period": 300,
                "legend": {
                  "position": "bottom"
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${LambdaFunction}", { "stat": "Average" }]
                ],
                "region": "${AWS::Region}",
                "title": "Lambda Average Duration",
                "period": 300,
                "legend": {
                  "position": "bottom"
                }
              }
            }
          ]
        }