---
- name: Harden CentOS 9 server
  hosts: all
  become: true
  vars:
    sshd_config: /etc/ssh/sshd_config
    pwquality_conf: /etc/security/pwquality.conf
    audit_rules: /etc/audit/rules.d/10-hardening.rules
  tasks:
    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: "{{ sshd_config }}"
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: restart sshd

    - name: Install password quality library
      ansible.builtin.dnf:
        name: libpwquality
        state: present

    - name: Enforce password complexity
      ansible.builtin.blockinfile:
        path: "{{ pwquality_conf }}"
        block: |
          minlen = 14
          minclass = 3
          maxrepeat = 2
          maxsequence = 4
          dictcheck = 1
          usercheck = 1
        create: true
        marker: "# {mark} ANSIBLE MANAGED - password complexity"

    - name: Install fail2ban
      ansible.builtin.dnf:
        name: fail2ban
        state: present

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    - name: Install audit package
      ansible.builtin.dnf:
        name: audit
        state: present

    - name: Configure basic auditd rules
      ansible.builtin.copy:
        dest: "{{ audit_rules }}"
        content: |
          -w /etc/passwd -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/sudoers -p wa -k privilege_escalation
          -w /var/log/audit/ -p wa -k audit_log
        owner: root
        group: root
        mode: '0640'
      notify: reload auditd

    - name: Enable and start auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started

  handlers:
    - name: restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted

    - name: reload auditd
      ansible.builtin.command: augenrules --load
      changed_when: true