resources:
- name: cloudrun-latency-alert
  type: gcp-types/monitoring-v3:projects.alertPolicies
  properties:
    displayName: Cloud Run p95 latency > 500ms
    combiner: OR
    conditions:
    - displayName: p95 latency exceeds 500ms for 5m
      conditionThreshold:
        filter: metric.type="run.googleapis.com/request_latencies" AND resource.type="cloud_run_revision"
        aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_PERCENTILE_95
          crossSeriesReducer: REDUCE_NONE
        comparison: COMPARISON_GT
        thresholdValue: 500
        duration: 300s
        trigger:
          count: 1
    notificationChannels:
    - projects/{{ env["project"] }}/notificationChannels/oncall-pager
    alertStrategy:
      autoClose: 86400s