resources:
- name: cloudrun-latency-alert
  type: monitoring.v3.alertPolicy
  properties:
    displayName: Cloud Run p95 latency > 500ms
    combiner: OR
    conditions:
    - displayName: p95 latency exceeds 500 ms for 5 min
      conditionThreshold:
        filter: metric.type="run.googleapis.com/request_latencies" AND resource.type="cloud_run_revision"
        aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_PERCENTILE_95
          crossSeriesReducer: REDUCE_MEAN
          groupByFields:
          - resource.label.service_name
          - resource.label.location
        comparison: COMPARISON_GT
        thresholdValue: 500
        duration: 300s
        trigger:
          count: 1
    notificationChannels:
    - projects/{{ env["project"] }}/notificationChannels/oncall-paging-channel
    alertStrategy:
      autoClose: 86400s