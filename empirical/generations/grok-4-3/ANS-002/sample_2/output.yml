---
- name: Configure Linux host firewall
  hosts: all
  become: true
  tasks:
    - name: Ensure ufw is installed
      ansible.builtin.package:
        name: ufw
        state: present
    - name: Allow SSH (port 22/tcp)
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
    - name: Allow HTTPS (port 443/tcp)
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp
    - name: Set default incoming policy to deny and enable firewall
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
        logging: on