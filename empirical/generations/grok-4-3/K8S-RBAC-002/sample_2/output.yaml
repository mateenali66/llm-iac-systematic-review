apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-crd-manager
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/component: rbac
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - example.com
  resources:
  - myresources
  verbs:
  - create
  - update
  - delete