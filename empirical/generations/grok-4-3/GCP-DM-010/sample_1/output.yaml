resources:
- name: multi-region-bucket
  type: storage.v1.bucket
  properties:
    name: my-unique-multi-region-bucket
    location: US
    storageClass: STANDARD
    uniformBucketLevelAccess:
      enabled: true
    lifecycle:
      rule:
      - action:
          type: Delete
        condition:
          age: 365
    labels:
      environment: production
      managed-by: deployment-manager