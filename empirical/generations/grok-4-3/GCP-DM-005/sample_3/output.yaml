resources:
- name: saas-postgres-instance
  type: sqladmin.v1beta4.instance
  properties:
    region: us-central1
    databaseVersion: POSTGRES_15
    settings:
      tier: db-custom-2-7680
      availabilityType: REGIONAL
      backupConfiguration:
        enabled: true
        startTime: "03:00"
        pointInTimeRecoveryEnabled: true
        backupRetentionSettings:
          retainedBackups: 30
          retentionUnit: COUNT
      ipConfiguration:
        ipv4Enabled: false
        privateNetwork: projects/{{ env["project"] }}/global/networks/default
        requireSsl: true
        sslMode: ENCRYPTED_ONLY
      maintenanceWindow:
        day: 7
        hour: 4
      userLabels:
        environment: production
        application: saas
        managed-by: deployment-manager
      dataDiskSizeGb: 100
      dataDiskType: PD_SSD
    rootPassword: "{{ properties["rootPassword"] }}"