apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-metrics
  labels:
    app.kubernetes.io/name: api-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-metrics
  endpoints:
  - port: 9090
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true