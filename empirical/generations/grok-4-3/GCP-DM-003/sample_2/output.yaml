resources:
- name: python-api-cloudrun
  type: gcp-types/run.googleapis.com:namespaces.services
  properties:
    parent: namespaces/{{ env["project_number"] }}
    apiVersion: serving.knative.dev/v1
    kind: Service
    metadata:
      name: python-api
      annotations:
        run.googleapis.com/ingress: all
    spec:
      template:
        metadata:
          annotations:
            autoscaling.knative.dev/minScale: "1"
            autoscaling.knative.dev/maxScale: "100"
            run.googleapis.com/cpu-throttling: "false"
        spec:
          containerConcurrency: 80
          serviceAccountName: {{ env["project_number"] }}-compute@developer.gserviceaccount.com
          containers:
          - image: us-docker.pkg.dev/{{ env["project"] }}/cloud-run-source-deploy/python-api:3.12-latest
            ports:
            - containerPort: 8080
            resources:
              limits:
                cpu: "2"
                memory: 1Gi
            env:
            - name: PORT
              value: "8080"
            - name: PYTHON_VERSION
              value: "3.12"