# FILE: Chart.yaml
apiVersion: v2
name: postgres
description: Postgres Helm chart for non-production environments
type: application
version: 0.1.0
appVersion: "15"
---
# FILE: values.yaml
replicaCount: 1
image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "15-alpine"
service:
  type: ClusterIP
persistence:
  enabled: true
  storageClassName: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce
secret:
  postgresPassword: "change-me-in-prod"
  database: "appdb"
  username: "appuser"
  password: "change-me-in-prod"
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 999
  fsGroup: 999
---
# FILE: templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "postgres.name" . }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secret.database | quote }}
  APP_USER: {{ .Values.secret.username | quote }}
  APP_PASSWORD: {{ .Values.secret.password | quote }}
---
# FILE: templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "postgres.name" . }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "postgres.name" . }}
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
---
# FILE: templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "postgres.name" . }}
spec:
  serviceName: {{ include "postgres.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "postgres.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "postgres.name" . }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-secret
                  key: POSTGRES_DB
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
---
# FILE: templates/init-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgres.fullname" . }}-init-db
  labels:
    app.kubernetes.io/name: {{ include "postgres.name" . }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      name: {{ include "postgres.fullname" . }}-init-db
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: APP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-secret
                  key: APP_USER
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-secret
                  key: APP_PASSWORD
            - name: APP_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-secret
                  key: POSTGRES_DB
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h {{ include "postgres.fullname" . }} -p 5432 -U postgres; do
                echo "Waiting for Postgres...";
                sleep 2;
              done
              psql -h {{ include "postgres.fullname" . }} -U postgres -d postgres -c "CREATE USER ${APP_USER} WITH PASSWORD '${APP_PASSWORD}';"
              psql -h {{ include "postgres.fullname" . }} -U postgres -d postgres -c "CREATE DATABASE ${APP_DB} OWNER ${APP_USER};"
              psql -h {{ include "postgres.fullname" . }} -U postgres -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE ${APP_DB} TO ${APP_USER};"