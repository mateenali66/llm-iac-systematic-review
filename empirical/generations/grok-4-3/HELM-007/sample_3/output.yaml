# FILE: Chart.yaml
apiVersion: v2
name: stateful-app
description: Helm chart for stateful application with migration hook
type: application
version: 1.0.0
appVersion: "1.0.0"
---
# FILE: values.yaml
replicaCount: 3
image:
  repository: myapp
  pullPolicy: IfNotPresent
  tag: "latest"
migration:
  image:
    repository: myapp-migrate
    pullPolicy: IfNotPresent
    tag: "latest"
  command: ["./migrate.sh"]
service:
  name: stateful-app
  port: 8080
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
storage:
  size: 10Gi
  storageClassName: standard
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
---
# FILE: templates/_helpers.tpl
{{- define "stateful-app.labels" -}}
app.kubernetes.io/name: {{ .Chart.Name }}
app.kubernetes.io/instance: {{ .Release.Name }}
app.kubernetes.io/version: {{ .Chart.AppVersion }}
{{- end -}}
---
# FILE: templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "stateful-app.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
---
# FILE: templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "stateful-app.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.service.name }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
---
# FILE: templates/job-migration.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-migration
  labels:
    {{- include "stateful-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  template:
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          command: {{ toYaml .Values.migration.command | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}