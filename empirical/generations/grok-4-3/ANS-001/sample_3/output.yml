---
- name: Install and configure nginx on Ubuntu
  hosts: all
  become: true
  vars:
    nginx_package: nginx
    firewall_port: 80
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install nginx
      ansible.builtin.apt:
        name: "{{ nginx_package }}"
        state: present

    - name: Ensure nginx service is started and enabled
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
        daemon_reload: true

    - name: Allow HTTP traffic on port 80
      community.general.ufw:
        rule: allow
        port: "{{ firewall_port }}"
        proto: tcp
        comment: "Allow HTTP"

    - name: Enable UFW firewall with defaults
      community.general.ufw:
        state: enabled
        default: deny
        logging: 'on'