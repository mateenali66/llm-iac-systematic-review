---
- name: Deploy Java application as systemd service
  hosts: all
  become: true
  vars:
    app_name: myapp
    app_user: myapp
    app_group: myapp
    app_dir: /opt/myapp
    jar_name: application.jar
    java_package: openjdk-21-jdk
    systemd_unit_path: /etc/systemd/system/{{ app_name }}.service

  tasks:
    - name: Install OpenJDK 21
      ansible.builtin.package:
        name: "{{ java_package }}"
        state: present
      register: jdk_install
      until: jdk_install is succeeded
      retries: 3
      delay: 5

    - name: Create service group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true
        state: present

    - name: Create service user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_dir }}"
        create_home: false
        state: present

    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0750"

    - name: Copy application JAR
      ansible.builtin.copy:
        src: "{{ jar_name }}"
        dest: "{{ app_dir }}/{{ jar_name }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
      notify: Restart {{ app_name }}

    - name: Create systemd unit file
      ansible.builtin.template:
        src: myapp.service.j2
        dest: "{{ systemd_unit_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd and restart {{ app_name }}

    - name: Ensure service is enabled and started
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Reload systemd and restart {{ app_name }}
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted
        daemon_reload: true

    - name: Restart {{ app_name }}
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted