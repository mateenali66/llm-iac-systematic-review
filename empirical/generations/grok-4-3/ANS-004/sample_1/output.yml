---
- name: Install and configure Prometheus node_exporter
  hosts: all
  become: true
  vars:
    node_exporter_version: "1.7.0"
    node_exporter_arch: "linux-amd64"
    node_exporter_user: "node_exporter"
    node_exporter_binary_path: "/usr/local/bin/node_exporter"
  tasks:
    - name: Create node_exporter system user
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        system: true
        shell: /usr/sbin/nologin
        createhome: false

    - name: Download node_exporter tarball
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        mode: "0644"
        owner: root
        group: root

    - name: Extract node_exporter binary
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: "/usr/local/bin"
        remote_src: true
        extra_opts:
          - "--strip-components=1"
          - "--wildcards"
          - "--no-anchored"
          - "*/node_exporter"
      notify: Restart node_exporter

    - name: Set ownership and permissions on binary
      ansible.builtin.file:
        path: "{{ node_exporter_binary_path }}"
        owner: root
        group: root
        mode: "0755"

    - name: Create systemd service unit
      ansible.builtin.copy:
        dest: "/etc/systemd/system/node_exporter.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ node_exporter_user }}
          Group={{ node_exporter_user }}
          Type=simple
          ExecStart={{ node_exporter_binary_path }} --web.listen-address=:9100
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd and restart node_exporter

    - name: Enable and start node_exporter service
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd and restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        daemon_reload: true
        state: restarted

    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted