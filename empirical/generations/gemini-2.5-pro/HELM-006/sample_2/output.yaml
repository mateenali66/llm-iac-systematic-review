# FILE: Chart.yaml
apiVersion: v2
name: generic-worker
description: A Helm chart for a generic worker service that consumes from a Redis queue.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - worker
  - redis
  - queue

---
# FILE: values.yaml
# Default values for generic-worker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: my-repo/my-worker
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Extra annotations for the pod.
podAnnotations: {}
# -- Extra labels for the pod.
podLabels: {}

# -- Pod-level security context.
# See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  fsGroup: 1001
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true

# -- Container-