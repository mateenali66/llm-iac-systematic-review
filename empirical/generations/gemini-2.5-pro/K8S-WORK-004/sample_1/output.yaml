apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-db-backup
  labels:
    app.kubernetes.io/name: db-backup
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-backup
            app.kubernetes.io/component: job-pod
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: db-backup-container
            image: myorg/db-backup:2.1
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-backup-secret
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-backup-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-backup-secret
                  key: DB_PASSWORD
            - name: BACKUP_PATH
              value: /backups/backup.sql.gz
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 250m
                memory: 256Mi
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            - name: tmp-data
              mountPath: /tmp
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: db-backup-pvc
          - name: tmp-data
            emptyDir: {}