- name: Configure static network interface with Netplan
  hosts: all
  become: true
  tasks:
    - name: Configure static IP for eth0
      netplan.netplan:
        state: present
        path: /etc/netplan/50-ansible.yaml
        network:
          version: 2
          renderer: networkd
          ethernets:
            eth0:
              dhcp4: false
              dhcp6: false
              addresses:
                - 192.168.1.10/24
              routes:
                - to: default
                  via: 192.168.1.1
              nameservers:
                addresses:
                  - 8.8.8.8
                  - 8.8.4.4
        validate: true