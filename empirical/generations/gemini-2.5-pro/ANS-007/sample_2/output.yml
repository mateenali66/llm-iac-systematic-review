- name: Configure static network interface with Netplan
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Generate and apply netplan configuration for a static interface
      community.general.netplan:
        state: present
        command: apply
        dest: /etc/netplan/50-ansible-static.yaml
        network:
          version: 2
          renderer: networkd
          ethernets:
            eth0:
              dhcp4: false
              addresses:
                - 192.168.1.10/24
              routes:
                - to: default
                  via: 192.168.1.1
              nameservers:
                addresses: [8.8.8.8, 1.1.1.1]