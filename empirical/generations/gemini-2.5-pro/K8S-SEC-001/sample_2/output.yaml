apiVersion: v1
kind: Pod
metadata:
  name: secure-nginx-pod
  labels:
    app: nginx
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  containers:
  - name: nginx
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
      protocol: TCP
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: tmp
      mountPath: /tmp
    - name: run
      mountPath: /var/run
  volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: tmp
    emptyDir: {}
  - name: run
    emptyDir: {}