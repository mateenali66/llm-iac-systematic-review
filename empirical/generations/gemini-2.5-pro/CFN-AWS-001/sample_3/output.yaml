AWSTemplateFormatVersion: '2010-09-09'
Description: 'Provisions a secure S3 bucket for application user uploads with logging, versioning, and lifecycle policies.'

Parameters:
  AppName:
    Type: String
    Description: 'The name of the application. Used for naming and tagging resources.'
    MinLength: 3
    MaxLength: 20
    AllowedPattern: '^[a-z0-9-]+$'

Resources:
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogsAfterOneYear
            Status: Enabled
            ExpirationInDays: 365
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Purpose
          Value: AccessLogs

  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AppName}-uploads-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: 's3-access-logs/'
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToInfrequentAccess
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Purpose
          Value: UserUploads

  UploadsBucketPolicy:
    Type: AWS::S