resources:
- name: custom-vpc
  type: compute.v1.network
  properties:
    autoCreateSubnetworks: false
    routingConfig:
      routingMode: REGIONAL

- name: public-subnet
  type: compute.v1.subnetwork
  properties:
    network: $(ref.custom-vpc.selfLink)
    ipCidrRange: 10.10.1.0/24
    region: us-central1
    description: "Public subnet for internet-facing resources"

- name: private-subnet
  type: compute.v1.subnetwork
  properties:
    network: $(ref.custom-vpc.selfLink)
    ipCidrRange: 10.10.2.0/24
    region: us-central1
    privateIpGoogleAccess: true
    description: "Private subnet for internal resources"

- name: nat-router
  type: compute.v1.router
  properties:
    network: $(ref.custom-vpc.selfLink)
    region: us-central1
    nats:
    - name: nat-gateway
      sourceSubnetworkIpRangesToNat: LIST_OF_SUBNETWORKS
      subnetworks:
      - name: $(ref.private-subnet.selfLink)
        sourceIpRangesToNat:
        - ALL_IP_RANGES
      natIpAllocateOption: AUTO_ONLY
      logConfig:
        enable: true
        filter: ERRORS_ONLY

- name: fw-allow-internal-all
  type: compute.v1.firewall
  properties:
    network: $(ref.custom-vpc.selfLink)
    description: "Allow all internal traffic within the VPC."
    priority: 1000
    sourceRanges:
    - 10.10.0.0/16
    allowed:
    - IPProtocol: tcp
      ports: ["0-65535"]
    - IPProtocol: udp
      ports: ["0