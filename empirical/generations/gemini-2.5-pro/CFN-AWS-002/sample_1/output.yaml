AWSTemplateFormatVersion: '2010-09-09'
Description: 'Production-ready EC2 Auto Scaling Group with an Application Load Balancer. (qs-1r1825a11)'

Parameters:
  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    Description: CIDR block for the VPC.
  PublicSubnet1Cidr:
    Type: String
    Default: '10.0.1.0/24'
    Description: CIDR block for the first public subnet.
  PublicSubnet2Cidr:
    Type: String
    Default: '10.0.2.0/24'
    Description: CIDR block for the second public subnet.
  PrivateSubnet1Cidr:
    Type: String
    Default: '10.0.101.0/24