resources:
- name: production-multi-region-bucket
  type: gcp-types/storage-v1:buckets
  properties:
    name: $(env.project)-$(env.deployment)-bucket
    location: US
    storageClass: MULTI_REGIONAL
    versioning:
      enabled: true
    iamConfiguration:
      uniformBucketLevelAccess:
        enabled: true
    lifecycle:
      rule:
      - action:
          type: Delete
        condition:
          age: 365
          isLive: true