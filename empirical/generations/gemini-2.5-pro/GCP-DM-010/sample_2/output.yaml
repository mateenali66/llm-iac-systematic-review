resources:
- name: multi-region-storage-bucket
  type: gcp-types/storage-v1:buckets
  properties:
    name: $(env.deployment)-bucket-$(env.project_number)
    location: US
    storageClass: STANDARD
    iamConfiguration:
      uniformBucketLevelAccess:
        enabled: true
    versioning:
      enabled: true
    lifecycle:
      rule:
      - action:
          type: Delete
        condition:
          age: 365
          isLive: true