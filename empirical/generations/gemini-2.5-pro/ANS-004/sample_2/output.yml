-
  name: Install and configure Prometheus node_exporter
  hosts: all
  become: true
  vars:
    node_exporter_version: "1.8.1"
    node_exporter_arch_map:
      x86_64: "amd64"
      aarch64: "arm64"
      armv7l: "armv7"
    node_exporter_checksums:
      "1.8.1":
        amd64: "sha256:96744b17a505b3880353a4eb921e43491376ab04c3273105a109819b8f10352e"
        arm64: "sha256:2522453a903285aadf35e83165b43803f27f12e454f7a2f50f24255581106e23"
        armv7: "sha256:947e012e316913f41235a583900e84d402379d84a233f443588235728014f14b"
    node_exporter_binary_install_dir: "/usr/local/bin"
    node_exporter_system_user: "node_exporter"
    node_exporter_system_group: "node_exporter"