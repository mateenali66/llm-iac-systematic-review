resources:
- name: gcs-cmek-keyring
  type: gcp-types/cloudkms-v1:projects.locations.keyRings
  properties:
    parent: projects/$(project)/locations/us
    keyRingId: gcs-cmek-keyring

- name: gcs-cmek-key
  type: gcp-types/cloudkms-v1:projects.locations.keyRings.cryptoKeys
  properties:
    parent: $(ref.gcs-cmek-keyring.name)
    cryptoKeyId: gcs-default-cmek
    resource:
      purpose: ENCRYPT_DECRYPT
      versionTemplate:
        algorithm: GOOGLE_SYMMETRIC_ENCRYPTION
        protectionLevel: HSM
      rotationPeriod: '7776000s'
      nextRotationTime: '2026-06-01T00:00:00Z'

outputs:
- name: keyRingName
  value: $(ref.gcs-cmek-keyring.name)
- name: cryptoKeyName
  value: $(ref.gcs-cmek-key.name)