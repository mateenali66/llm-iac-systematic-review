apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: secure-nginx
data:
  default.conf: |
    user nginx;
    worker_processes auto;
    pid /var/run/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      access_log /var/log/nginx/access.log;
      error_log /var/log/nginx/error.log;

      sendfile        on;
      keepalive_timeout  65;

      server {
        listen 8080;
        server_name _;
        location / {
          return 200 'OK';
        }
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-secure
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: secure-nginx
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: nginx
    image: nginx:1.26.2-alpine
    imagePullPolicy: IfNotPresent
    ports:
    - name: http
      containerPort: 8080
      protocol: TCP
    securityContext:
      capabilities:
        drop: ["ALL"]
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    livenessProbe:
      httpGet:
        path: /
        port: http
        scheme: HTTP
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    volumeMounts:
      - name: nginx-config
        mountPath: /etc/nginx/conf.d
        readOnly: true
      - name: nginx-cache
        mountPath: /var/cache/nginx
      - name: nginx-run
        mountPath: /var/run
      - name: nginx-logs
        mountPath: /var/log/nginx
      - name: tmp
        mountPath: /tmp
  restartPolicy: Always
  volumes:
    - name: nginx-config
      configMap:
        name: nginx-config
        items:
          - key: default.conf
            path: default.conf
    - name: nginx-cache
      emptyDir: {}
    - name: nginx-run
      emptyDir: {}
    - name: nginx-logs
      emptyDir: {}
    - name: tmp
      emptyDir: {}