apiVersion: v1
kind: Secret
metadata:
  name: redis-cluster-auth
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cluster
type: Opaque
stringData:
  password: "change-this-to-a-strong-random-password"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-headless
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cluster
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cluster
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: cluster-bus
      port: 16379
      targetPort: 16379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cluster
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cluster
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cluster
spec:
  serviceName: redis-cluster-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis-cluster
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis-cluster
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: redis
                    app.kubernetes.io/instance: redis-cluster
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: redis-cluster
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: redis-cluster
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: redis
              containerPort: 6379
            - name: cluster-bus
              containerPort: 16379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-cluster-auth
                  key: password
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STATEFULSET_NAME
              value: "redis-cluster"
            - name: HEADLESS_SERVICE
              value: "redis-cluster-headless"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail

              REDIS_ARGS="--port 6379 \
                --dir /data \
                --bind 0.0.0.0 \
                --protected-mode yes \
                --requirepass ${REDIS_PASSWORD} \
                --masterauth ${REDIS_PASSWORD} \
                --appendonly yes \
                --cluster-enabled yes \
                --cluster-config-file /data/nodes.conf \
                --cluster-node-timeout 5000 \
                --cluster-announce-ip ${POD_IP} \
                --cluster-announce-port 6379 \
                --cluster-announce-bus-port 16379"

              redis-server ${REDIS_ARGS} &
              REDIS_PID=$!

              # Wait for local Redis to be ready
              until redis-cli -a "${REDIS_PASSWORD}" -h 127.0.0.1 -p 6379 ping | grep -q PONG; do
                sleep 2
              done

              # Only the first pod (ordinal 0) performs cluster creation
              ORDINAL="${POD_NAME##*-}"
              if [ "${ORDINAL}" = "0" ]; then
                # Wait for all 3 pods' Redis instances to be reachable
                for i in 0 1 2; do
                  HOST="${STATEFULSET_NAME}-${i}.${HEADLESS_SERVICE}"
                  until redis-cli -a "${REDIS_PASSWORD}" -h "${HOST}" -p 6379 ping | grep -q PONG; do
                    sleep 2
                  done
                done

                # Check if cluster is already configured; if not, create it
                if ! redis-cli -a "${REDIS_PASSWORD}" -h "${STATEFULSET_NAME}-0.${HEADLESS_SERVICE}" -p 6379 cluster info 2>/dev/null | grep -q "cluster_state:ok"; then
                  yes yes | redis-cli -a "${REDIS_PASSWORD}" --cluster create \
                    "${STATEFULSET_NAME}-0.${HEADLESS_SERVICE}:6379" \
                    "${STATEFULSET_NAME}-1.${HEADLESS_SERVICE}:6379" \
                    "${STATEFULSET_NAME}-2.${HEADLESS_SERVICE}:6379" \
                    --cluster-replicas 0
                fi
              fi

              # Graceful shutdown on SIGTERM
              trap 'redis-cli -a "${REDIS_PASSWORD}" -h 127.0.0.1 -p 6379 shutdown nosave || true' TERM INT

              wait "${REDIS_PID}"
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    redis-cli -a "${REDIS_PASSWORD}" -h 127.0.0.1 -p 6379 shutdown nosave || true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "${REDIS_PASSWORD}" -h 127.0.0.1 -p 6379 ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "${REDIS_PASSWORD}" -h 127.0.0.1 -p 6379 ping | grep -q PONG
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "${REDIS_PASSWORD}" -h 127.0.0.1 -p 6379 ping | grep -q PONG
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-cluster-pdb
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cluster
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis-cluster
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-cluster-network-policy
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cluster
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis-cluster
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 6379
      from:
        - podSelector: {} # allow all pods in the same namespace to access Redis service port
    - ports:
        - protocol: TCP
          port: 16379
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: redis-cluster
  egress:
    - ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: redis-cluster
        - podSelector: {} # allow egress to other pods in namespace (e.g., clients)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector: {}