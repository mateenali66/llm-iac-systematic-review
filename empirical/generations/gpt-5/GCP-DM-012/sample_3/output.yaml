resources:
- name: cloud-armor-security-policy
  type: compute.v1.securityPolicy
  properties:
    description: Cloud Armor policy blocking specified countries and per-IP rate limiting
    type: CLOUD_ARMOR
    rules:
    - priority: 100
      description: Block traffic from specified countries
      action: "deny(403)"
      match:
        expr:
          expression: "origin.country_code in ['CN', 'RU', 'KP']"
      preview: false
    - priority: 200
      description: Per-IP rate limit
      action: "throttle"
      match:
        versionedExpr: SRC_IPS_V1
        config:
          srcIpRanges:
          - "*"
      rateLimitOptions:
        conformAction: "allow"
        exceedAction: "deny(429)"
        rateLimitThreshold:
          count: 1000
          intervalSec: 60
        enforceOnKey: "IP"
      preview: false
    - priority: 2147483647
      description: Default allow
      action: "allow"
      match:
        versionedExpr: SRC_IPS_V1
        config:
          srcIpRanges:
          - "*"
      preview: false