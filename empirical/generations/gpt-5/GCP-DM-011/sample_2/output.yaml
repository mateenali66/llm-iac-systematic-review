resources:
- name: vpc-mig
  type: compute.v1.network
  properties:
    autoCreateSubnetworks: false

- name: subnet-mig
  type: compute.v1.subnetwork
  properties:
    ipCidrRange: 10.10.0.0/24
    region: us-central1
    network: $(ref.vpc-mig.selfLink)
    privateIpGoogleAccess: true

- name: router-mig
  type: compute.v1.router
  properties:
    region: us-central1
    network: $(ref.vpc-mig.selfLink)
    nats:
    - name: nat-mig
      natIpAllocateOption: AUTO_ONLY
      sourceSubnetworkIpRangesToNat: LIST_OF_SUBNETWORKS
      subnetworks:
      - name: $(ref.subnet-mig.selfLink)
        sourceIpRangesToNat:
        - ALL_IP_RANGES

- name: fw-allow-lb-health-checks
  type: compute.v1.firewall
  properties:
    network: $(ref.vpc-mig.selfLink)
    direction: INGRESS
    priority: 1000
    targetTags:
    - web
    sourceRanges:
    - 35.191.0.0/16
    - 130.211.0.0/22
    allowed:
    - IPProtocol: TCP
      ports:
      - "80"

- name: it-web-mig
  type: compute.v1.instanceTemplate
  properties:
    properties:
      machineType: e2-medium
      tags:
        items:
        - web
      shieldedInstanceConfig:
        enableSecureBoot: true
        enableVtpm: true
        enableIntegrityMonitoring: true
      disks:
      - boot: true
        autoDelete: true
        type: PERSISTENT
        initializeParams:
          sourceImage: projects/debian-cloud/global/images/family/debian-12
      networkInterfaces:
      - subnetwork: $(ref.subnet-mig.selfLink)
      serviceAccounts:
      - email: default
        scopes:
        - https://www.googleapis.com/auth/logging.write
        - https://www.googleapis.com/auth/monitoring.write
      metadata:
        items:
        - key: enable-oslogin
          value: "TRUE"
        - key: startup-script
          value: |
            #!/bin/bash
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y nginx
            cat >/var/www/html/index.html <<'EOF'
            <!doctype html>
            <html>
              <head><title>MIG Web</title></head>
              <body>
                <h1>Hello from Managed Instance Group</h1>
              </body>
            </html>
            EOF
            systemctl enable nginx
            systemctl restart nginx

- name: hc-http-80
  type: compute.v1.healthCheck
  properties:
    type: HTTP
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    httpHealthCheck:
      port: 80
      requestPath: /

- name: mig-web-igm
  type: compute.v1.instanceGroupManager
  properties:
    baseInstanceName: web
    zone: us-central1-a
    instanceTemplate: $(ref.it-web-mig.selfLink)
    targetSize: 1
    namedPorts:
    - name: http
      port: 80
    autoHealingPolicies:
    - healthCheck: $(ref.hc-http-80.selfLink)
      initialDelaySec: 60
    updatePolicy:
      type: PROACTIVE
      minimalAction: REPLACE
      maxSurge:
        fixed: 1
      maxUnavailable:
        fixed: 0

- name: mig-web-autoscaler
  type: compute.v1.autoscaler
  properties:
    zone: us-central1-a
    target: $(ref.mig-web-igm.selfLink)
    autoscalingPolicy:
      minNumReplicas: 1
      maxNumReplicas: 5
      coolDownPeriodSec: 60
      cpuUtilization:
        utilizationTarget: 0.6

- name: web-backend-service
  type: compute.v1.backendService
  properties:
    loadBalancingScheme: EXTERNAL
    protocol: HTTP
    portName: http
    healthChecks:
    - $(ref.hc-http-80.selfLink)
    timeoutSec: 30
    sessionAffinity: NONE
    backends:
    - group: $(ref.mig-web-igm.instanceGroup)

- name: web-url-map
  type: compute.v1.urlMap
  properties:
    defaultService: $(ref.web-backend-service.selfLink)

- name: web-ssl-cert
  type: compute.v1.sslCertificate
  properties:
    name: web-ssl-cert
    managed:
      domains:
      - example.com

- name: lb-ip
  type: compute.v1.globalAddress
  properties:
    addressType: EXTERNAL
    ipVersion: IPV4

- name: https-proxy
  type: compute.v1.targetHttpsProxy
  properties:
    urlMap: $(ref.web-url-map.selfLink)
    sslCertificates:
    - $(ref.web-ssl-cert.selfLink)

- name: https-forwarding-rule
  type: compute.v1.globalForwardingRule
  properties:
    loadBalancingScheme: EXTERNAL
    IPAddress: $(ref.lb-ip.address)
    IPProtocol: TCP
    portRange: "443"
    target: $(ref.https-proxy.selfLink)