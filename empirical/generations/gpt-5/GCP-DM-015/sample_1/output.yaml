resources:
- name: oncall-email-channel
  type: gcp-types/monitoring-v3:projects.notificationChannels
  properties:
    displayName: On-call Paging Email
    description: Notification channel for paging the on-call team
    type: email
    labels:
      email_address: oncall@example.com
- name: cloudrun-p95-latency-alert
  type: gcp-types/monitoring-v3:projects.alertPolicies
  properties:
    displayName: Cloud Run p95 latency > 500 ms for 5m
    combiner: AND
    enabled: true
    severity: CRITICAL
    documentation:
      content: |
        This alert fires when the 95th-percentile request latency for a Cloud Run service
        exceeds 500 ms for at least 5 minutes. Investigate the affected service and region.
      mimeType: text/markdown
    notificationChannels:
    - $(ref.oncall-email-channel.name)
    alertStrategy:
      notificationRateLimit:
        period: 3600s
      autoClose: 604800s
    conditions:
    - displayName: Cloud Run service p95 latency > 500 ms
      conditionThreshold:
        filter: resource.type="cloud_run_revision" AND metric.type="run.googleapis.com/request_latencies"
        comparison: COMPARISON_GT
        thresholdValue: 0.5
        duration: 300s
        trigger:
          count: 1
        aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_PERCENTILE_95
          crossSeriesReducer: REDUCE_MAX
          groupByFields:
          - resource.label.service_name
          - resource.label.location
        evaluationMissingData: EVALUATION_MISSING_DATA_INACTIVE
    userLabels:
      managed-by: deployment-manager