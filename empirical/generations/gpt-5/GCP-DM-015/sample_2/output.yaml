resources:
- name: oncall-email-channel
  type: gcp-types/monitoring-v3:projects.notificationChannels
  properties:
    displayName: On-call Paging Email
    type: email
    labels:
      email_address: oncall@example.com
    userLabels:
      team: sre
      purpose: paging

- name: cloud-run-p95-latency-alert
  type: gcp-types/monitoring-v3:projects.alertPolicies
  properties:
    displayName: Cloud Run P95 latency > 500 ms for 5m (my-cloud-run-service)
    combiner: AND
    enabled: true
    documentation:
      content: |
        Pages on-call when Cloud Run service 'my-cloud-run-service' 95th percentile latency exceeds 500 ms for 5 minutes.
      mimeType: text/markdown
    conditions:
    - displayName: P95 latency > 500 ms for 5m
      conditionThreshold:
        filter: resource.type="cloud_run_revision" AND metric.type="run.googleapis.com/request_latencies" AND resource.labels.service_name="my-cloud-run-service"
        aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_PERCENTILE_95
        crossSeriesReducer: REDUCE_MAX
        groupByFields:
        - resource.labels.service_name
        comparison: COMPARISON_GT
        thresholdValue: 500
        duration: 300s
        trigger:
          count: 1
        evaluationMissingData: EVALUATION_MISSING_DATA_NO_OP
    notificationChannels:
    - $(ref.oncall-email-channel.name)
    alertStrategy:
      notificationRateLimit:
        period: 3600s
      autoClose: 604800s
    userLabels:
      service: my-cloud-run-service
      environment: prod
      severity: critical