apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-metrics
spec:
  selector: {}
  endpoints:
    - targetPort: 9090
      interval: 30s
      scheme: http
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          action: keep
          regex: api-metrics