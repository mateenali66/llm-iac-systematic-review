apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-readonly
  namespace: monitoring
  labels:
    app.kubernetes.io/name: monitoring-readonly
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: iac
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-readonly-binding
  namespace: monitoring
  labels:
    app.kubernetes.io/name: monitoring-readonly-binding
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: iac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-readonly
subjects:
  - kind: ServiceAccount
    name: monitoring-reader
    namespace: monitoring