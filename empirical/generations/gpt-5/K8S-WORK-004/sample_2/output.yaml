apiVersion: v1
kind: Namespace
metadata:
  name: db-backups
  labels:
    app.kubernetes.io/name: db-backup
    app.kubernetes.io/part-of: backup-jobs
    app.kubernetes.io/managed-by: iac
---
apiVersion: v1
kind: Secret
metadata:
  name: db-backup-credentials
  namespace: db-backups
  labels:
    app.kubernetes.io/name: db-backup
    app.kubernetes.io/part-of: backup-jobs
    app.kubernetes.io/managed-by: iac
type: Opaque
stringData:
  DB_HOST: "CHANGE_ME"
  DB_PORT: "5432"
  DB_NAME: "CHANGE_ME"
  DB_USER: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  S3_BUCKET: "s3://my-backups/CHANGE_ME"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_REGION: "us-east-1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-backup-runner
  namespace: db-backups
  labels:
    app.kubernetes.io/name: db-backup
    app.kubernetes.io/part-of: backup-jobs
    app.kubernetes.io/managed-by: iac
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-db-backup
  namespace: db-backups
  labels:
    app.kubernetes.io/name: db-backup
    app.kubernetes.io/instance: nightly
    app.kubernetes.io/version: "2.1"
    app.kubernetes.io/part-of: backup-jobs
    app.kubernetes.io/managed-by: iac
spec:
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-backup
            app.kubernetes.io/instance: nightly
            app.kubernetes.io/version: "2.1"
            app.kubernetes.io/part-of: backup-jobs
            app.kubernetes.io/managed-by: iac
          annotations:
            kubectl.kubernetes.io/default-container: db-backup
        spec:
          serviceAccountName: db-backup-runner
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 60
          nodeSelector:
            kubernetes.io/os: linux
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: db-backup
            image: myorg/db-backup:2.1
            imagePullPolicy: IfNotPresent
            envFrom:
            - secretRef:
                name: db-backup-credentials
                optional: false
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"
              limits:
                cpu: "1"
                memory: "1Gi"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              runAsUser: 10001
              runAsGroup: 10001
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}