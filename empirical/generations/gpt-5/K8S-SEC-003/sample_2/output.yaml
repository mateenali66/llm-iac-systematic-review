apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-compute-quota
  namespace: team-a
  labels:
    app.kubernetes.io/name: resource-quota
    app.kubernetes.io/part-of: team-a
spec:
  hard:
    pods: "100"
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "16"
    limits.memory: 32Gi