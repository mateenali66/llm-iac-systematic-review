apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  labels:
    app.kubernetes.io/name: web-frontend
    app.kubernetes.io/instance: web-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: frontend
    app.kubernetes.io/tier: frontend
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: web-frontend
    app.kubernetes.io/instance: web-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  labels:
    app.kubernetes.io/name: web-frontend
    app.kubernetes.io/instance: web-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: frontend
    app.kubernetes.io/tier: frontend
    app.kubernetes.io/version: "1.27"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: web-frontend
      app.kubernetes.io/instance: web-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-frontend
        app.kubernetes.io/instance: web-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: frontend
        app.kubernetes.io/tier: frontend
        app.kubernetes.io/version: "1.27"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web-frontend
              app.kubernetes.io/instance: web-frontend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: web-frontend
                    app.kubernetes.io/instance: web-frontend
      containers:
        - name: nginx
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "SETGID", "SETUID"]
          volumeMounts:
            - name: var-cache-nginx
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
            - name: var-log-nginx
              mountPath: /var/log/nginx
      terminationGracePeriodSeconds: 30
      volumes:
        - name: var-cache-nginx
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: var-log-nginx
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-frontend-pdb
  labels:
    app.kubernetes.io/name: web-frontend
    app.kubernetes.io/instance: web-frontend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-frontend
      app.kubernetes.io/instance: web-frontend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-frontend-allow-http
  labels:
    app.kubernetes.io/name: web-frontend
    app.kubernetes.io/instance: web-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-frontend
      app.kubernetes.io/instance: web-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443