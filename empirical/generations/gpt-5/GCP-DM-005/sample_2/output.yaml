resources:
  - name: saas-vpc
    type: compute.v1.network
    properties:
      autoCreateSubnetworks: false
      routingConfig:
        routingMode: REGIONAL

  - name: saas-vpc-us-central1
    type: compute.v1.subnetwork
    properties:
      region: us-central1
      ipCidrRange: 10.10.0.0/16
      network: $(ref.saas-vpc.selfLink)
      privateIpGoogleAccess: true

  - name: saas-sql-psc-range
    type: compute.v1.globalAddresses
    properties:
      purpose: VPC_PEERING
      addressType: INTERNAL
      prefixLength: 16
      network: $(ref.saas-vpc.selfLink)
      description: Reserved range for Cloud SQL private service connection

  - name: saas-svcnx
    type: gcp-types/servicenetworking-v1:services.connections
    properties:
      parent: services/servicenetworking.googleapis.com
      network: $(ref.saas-vpc.selfLink)
      reservedPeeringRanges:
        - $(ref.saas-sql-psc-range.name)

  - name: saas-pg15
    type: gcp-types/sqladmin-v1beta4:instances
    metadata:
      dependsOn:
        - saas-svcnx
    properties:
      name: saas-pg15
      region: us-central1
      databaseVersion: POSTGRES_15
      deletionProtectionEnabled: true
      settings:
        tier: db-custom-2-7680
        availabilityType: REGIONAL
        activationPolicy: ALWAYS
        dataDiskType: PD_SSD
        dataDiskSizeGb: 100
        storageAutoResize: true
        storageAutoResizeLimit: 2048
        userLabels:
          environment: prod
          app: saas
        ipConfiguration:
          ipv4Enabled: false
          privateNetwork: $(ref.saas-vpc.selfLink)
          requireSsl: true
        backupConfiguration:
          enabled: true
          startTime: 01:00
          location: us
          pointInTimeRecoveryEnabled: true
          backupRetentionSettings:
            retentionUnit: COUNT
            retainedBackups: 7
        maintenanceWindow:
          day: 7
          hour: 3
          updateTrack: stable
        databaseFlags:
          - name: cloudsql.iam_authentication
            value: on
          - name: log_min_duration_statement
            value: "5000"
          - name: log_checkpoints
            value: on
          - name: log_connections
            value: on
          - name: log_disconnections
            value: on
          - name: log_lock_waits
            value: on
          - name: timezone
            value: UTC
          - name: shared_preload_libraries
            value: pg_stat_statements
          - name: pg_stat_statements.track
            value: all
          - name: pg_stat_statements.max
            value: "10000"
        insightsConfig:
          queryInsightsEnabled: true
          queryStringLength: 1024
          recordApplicationTags: true
          recordClientAddress: true