apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-db-ingress
spec:
  podSelector:
    matchLabels:
      app: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 5432