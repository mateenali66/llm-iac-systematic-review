resources:
- name: multi-region-storage-bucket
  type: gcp-types/storage-v1:buckets
  properties:
    name: your-unique-bucket-name
    location: US
    storageClass: STANDARD
    iamConfiguration:
      uniformBucketLevelAccess:
        enabled: true
      publicAccessPrevention: enforced
    lifecycle:
      rule:
      - action:
          type: Delete
        condition:
          age: 365
          isLive: true
    labels:
      environment: prod
      managed-by: deployment-manager